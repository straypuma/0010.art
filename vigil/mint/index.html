<style>
/* A private page: its content (the mint page's markup and code, and the piece) is encrypted (AES-256-GCM, key from the
   password by PBKDF2-SHA256) and only decrypted in the browser. Generated by the vigil repo's tools/sync-mint.mjs; edit the
   templates there (tools/site/mint-*), not this file. */
.bar { display: flex; }
[hidden] { display: none !important; }
.lock { display: grid; place-items: center; min-height: calc(100vh - 56px); min-height: calc(100svh - 56px); padding: var(--gutter); text-align: center; }
.lock form { display: grid; justify-items: center; gap: 18px; }
.lock .eye { width: 54px; height: 54px; }
.lock .label { margin: 0; font: 400 11.5px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.lock .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.lock input { width: min(260px, 70vw); padding: 13px 20px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .45); box-shadow: inset 0 0 0 1px var(--rule); font: 400 13px/1 var(--mono); color: var(--ink); }
.lock input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--ink); }
.lock .msg { min-height: 1.4em; margin: 0; font: 400 11px/1.4 var(--mono); letter-spacing: .03em; color: var(--ink-2); }
button.btn { border: 0; cursor: pointer; }
button.btn[disabled] { opacity: .35; cursor: default; background: var(--ink); }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.btn.ghost:hover { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px currentColor; }
.btn.ghost[disabled] { background: transparent; color: var(--ink); }

/* the mint page */
.mint { max-width: 75rem; margin: 0 auto; padding: clamp(24px, 4vw, 56px) var(--gutter) 96px; }
.mint .label { margin: 0 0 14px; font: 400 11.5px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.mint .lede { max-width: 36rem; margin: 0; text-wrap: pretty; }   /* (no lone word on its last line) */
.facts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 26px 0 0; padding: 0; list-style: none; font: 400 12.5px/1.6 var(--mono); color: var(--ink-2); }
.facts b { font-weight: 400; color: var(--ink); }
.facts a, .note a, .owner a { color: inherit; }
.box { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--rule); }
.wallets, .acts, .buy-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.wallets img { width: 18px; height: 18px; border-radius: 4px; }
.who { margin: 0 0 14px; font: 400 13px/1.6 var(--mono); }
.qty { display: inline-flex; align-items: center; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--rule); }
.qty button { width: 44px; height: 44px; padding: 0; border: 0; background: none; font: 400 17px/1 var(--mono); color: var(--ink); cursor: pointer; }
.qty button[disabled] { opacity: .3; cursor: default; }
.qty output { min-width: 3ch; text-align: center; font: 400 15px/1 var(--mono); }
.total { font: 400 13px/1.4 var(--mono); color: var(--ink-2); }
.note { min-height: 1.6em; margin: 14px 0 0; font: 400 12px/1.6 var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.note.bad { color: var(--accent); }
#chain-note:empty { display: none; }
/* once a wallet is connected on the right network, the wallet section gives way to a button in the bar, next to "vigil";
   it opens a small card (a popover: the browser closes it on a click outside or Escape) with the account and "disconnect" */
.conn { padding: 6px 12px; border: 0; border-radius: 999px; background: none; box-shadow: inset 0 0 0 1px var(--rule); font: inherit; color: var(--ink); cursor: pointer; }
.conn:hover, .bar:has(.conn-menu:popover-open) .conn { box-shadow: inset 0 0 0 1px var(--ink); }
.conn-menu { inset: 62px var(--gutter) auto auto; margin: 0; padding: 16px 18px 18px; border: 0; border-radius: 12px; background: var(--paper) var(--grain); color: var(--ink);
  box-shadow: 0 0 0 1px var(--rule), 0 14px 32px -12px rgb(42 36 33 / .35); font: 400 12.5px/1.7 var(--mono); }
.conn-menu p { margin: 0 0 14px; }
.conn-menu a { color: inherit; }
.conn-menu .n { color: var(--ink-2); }
.conn-menu .btn { padding: 11px 18px; font-size: 12px; }
/* the arrows of the preview page (under its family row): the piece before and the piece after */
.steps { display: flex; justify-content: center; gap: clamp(48px, 9vw, 104px); }
.steps button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-2); cursor: pointer; }
.steps button:hover { color: var(--ink); }
.steps button[aria-disabled="true"] { opacity: .35; color: var(--ink-2); cursor: default; }
.steps svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
/* the wallet's family, in mint order: each piece drawn live while it is in view (browsers allow about 16 live renderers) */
/* (no scrollbar: a row is scrolled by trackpad, dragged with the mouse, or moved by its arrows) */
.fam-row { position: relative; display: flex; gap: 4px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x proximity; overscroll-behavior-x: contain;
  scrollbar-width: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.fam-row::-webkit-scrollbar { display: none; }
.fam-row.dragging { scroll-snap-type: none; }
.fam-row.dragging, .fam-row.dragging .open { cursor: grabbing; }
.fam-row figure { flex: 0 0 auto; margin: 0; scroll-snap-align: start; }
.fam-row { --fh: clamp(220px, 34vw, 340px); }
.fam-row .frame { position: relative; height: var(--fh); width: calc((var(--fh) - 20px) / var(--H, 1) + 20px); }   /* the piece's format (H: height over width, as it reports it) plus its 10px margin */
.fam-row iframe { width: 100%; height: 100%; border: 0; display: block; }
/* over each piece, a button that opens it larger (so a click here opens it, where on the piece itself it would drop a stone) */
.fam-row .open { position: absolute; inset: 0; z-index: 1; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.fam-row .open:focus-visible { outline-offset: -2px; }
.fam .steps { margin-top: -4px; }
.fam-row figcaption { padding: 8px 10px 0; font: 400 11px/1.4 var(--mono); color: var(--ink-2); }
.fam + .fam { margin-top: 30px; }
.fam-cap { margin: 0 0 10px; font: 400 11px/1.4 var(--mono); color: var(--ink-2); }
.fam-row figure.new figcaption { color: var(--accent); }
.owner dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 20px; margin: 0 0 20px; font: 400 12px/1.6 var(--mono); }
.owner dt { color: var(--ink-2); }
.owner dd { margin: 0; overflow-wrap: anywhere; }
.other { margin-top: 30px; }
.other input { box-sizing: border-box; width: min(100%, 25rem); height: 41px; padding: 0 20px;   /* (the buttons' height) */ border: 0; border-radius: 999px; background: rgb(255 255 255 / .45); box-shadow: inset 0 0 0 1px var(--rule); font: 400 13px/1 var(--mono); color: var(--ink); }
.other input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--ink); }

/* a piece opened larger, over the page: the artwork beside its traits, as on the preview page, with the arrows under it
   stepping through its family. The artwork's box is sized by the script to the piece's format; the frame bleeds 28px past it
   (the piece's own margin inside its frame). */
.big { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--paper) var(--grain); color: var(--ink); overflow: hidden auto; overscroll-behavior: contain; }
.big::backdrop { background: var(--paper); }
html:has(.big[open]) { overflow: hidden; scrollbar-gutter: stable; }   /* (where scrollbars always show, the page keeps its width, so nothing behind moves) */
.big-in { box-sizing: border-box; min-height: 100%; display: grid; grid-template-columns: auto minmax(0, 26rem); justify-content: center; align-items: center; gap: clamp(28px, 5vw, 80px); padding: 52px var(--gutter); }
.big-piece { display: grid; justify-items: center; gap: 12px; }
.big-art { position: relative; }
.big-in:has(.steps:not([hidden])) .big-text { padding-bottom: 56px; }   /* (centred on the artwork, not on it and its arrows) */
.big-art iframe { position: absolute; inset: -28px; width: calc(100% + 56px); height: calc(100% + 56px); border: 0; display: block; }
.big-text .label { margin: 0 0 14px; font: 400 11.5px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.big-text .label b { margin-left: .5em; font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--ink); }
.big dl { display: grid; grid-template-columns: repeat(2, 7.4em minmax(0, 1fr)); gap: 3px 12px; margin: 0; font: 400 11.5px/1.55 var(--mono); }
.big dt { color: var(--ink-2); }
.big dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.big-links { margin: 22px 0 0; font: 400 11.5px/1.55 var(--mono); color: var(--ink-2); }   /* the token's own pages, under its traits */
.big-links:empty { display: none; }
.big-links a { color: var(--ink); text-underline-offset: 3px; }
.big-links a:hover { color: var(--accent); }
.big-close { position: fixed; z-index: 2; top: 14px; right: clamp(10px, 2vw, 28px); display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%;
  background: var(--paper); box-shadow: inset 0 0 0 1px var(--rule); color: var(--ink); cursor: pointer; }
.big-close:hover { box-shadow: inset 0 0 0 1px var(--ink); }
.big-close svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
/* a family: its row runs from the window's left edge to short of the text, and cuts off the siblings at both ends. The strip
   (one frame drawing every piece that shows) lies under the scroller, whose empty panels are where it snaps. */
.big.fam .big-in { grid-template-columns: minmax(0, 1fr) 26rem; padding-left: 0; }
.big-row { position: relative; overflow: hidden; }
.big-row iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
.big-row .row { position: absolute; inset: 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
  cursor: grab; user-select: none; -webkit-user-select: none; outline-offset: -2px; }
.big-row .row::-webkit-scrollbar { display: none; }
.big-row .row.dragging { scroll-snap-type: none; cursor: grabbing; }
.big-row .track { position: relative; height: 100%; }
.big-row .panel { position: absolute; top: 0; height: 100%; scroll-snap-align: start; }
</style>
</head>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const P = JSON.parse($('#payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = $('.lock .msg'), input = $('.lock input');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'this page needs a secure (https) connection'; return; }

  // the password stretches into an AES key (PBKDF2, many rounds, so guessing is slow); a wrong password fails the GCM check
  const decrypt = async pw => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data))));
  };
  const open = async (pw, quiet) => {
    if (!pw) return;
    msg.textContent = 'opening…';
    let data;
    try { data = await decrypt(pw); }
    catch {
      try { sessionStorage.removeItem('vigil-key'); } catch { }
      msg.textContent = quiet ? '' : 'that isn’t it'; input.select();
      return;
    }
    try { sessionStorage.setItem('vigil-key', pw); } catch { }   // this tab only, shared with the vigil page
    document.title = 'vigil mint — 0010';
    $('#app').innerHTML = data.html;
    new Function('D', data.js)(data);                // the page's own code, which arrived encrypted with it
  };
  $('.lock form').addEventListener('submit', e => { e.preventDefault(); open(input.value); });
  // a shared link may carry the password after # (#k=…), which browsers never send to the server; it is taken out at once
  const m = location.hash.match(/^#k=(.+)$/);
  let kept = null; try { kept = sessionStorage.getItem('vigil-key'); } catch { }
  if (m) { history.replaceState(null, '', location.pathname + location.search); open(decodeURIComponent(m[1])); }
  else if (kept) open(kept, true);
  else input.focus();
})();
</script>
