/* A private page: its content is encrypted (AES-256-GCM, key from the password by PBKDF2-SHA256) and only decrypted

[hidden] { display: none !important; }                  /* (the site's .btn and others would show them anyway) */
.lock { display: grid; place-items: center; min-height: calc(100vh - 56px); min-height: calc(100svh - 56px); padding: var(--gutter); text-align: center; }

/* The piece beside its text, like an auction lot. The artwork has a fixed slot (sized by the script for the largest,
   square piece), so the text never moves; the piece keeps a 28px margin inside its frame, so the slot bleeds out by 28px.

.vigil-view { padding-top: clamp(24px, 4vw, 56px); overflow-x: clip; }
.vigil { display: grid; grid-template-columns: auto minmax(0, 34rem); justify-content: center; gap: clamp(28px, 5vw, 80px); align-items: start; }
.vigil .piece { position: sticky; top: 72px; width: min(80svh, 1100px); height: min(80svh, 1100px); margin: -28px; }
.vigil .piece iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
.piece-bar { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0 0; }
@media (max-width: 900px) {
  .vigil { grid-template-columns: minmax(0, 1fr); }
  .vigil-text { display: contents; }                   /* stacked: the intro, then the piece, then the notes */
  .vigil-intro { order: -1; }
  .vigil-notes { order: 1; min-width: 0; }
  .vigil .piece { position: relative; top: auto; justify-self: center; width: calc(100% + 56px); height: min(76svh, 900px); }
}
/* full screen: the real thing where the browser allows it, otherwise (iPhone) a fixed overlay */
.vigil .piece:fullscreen, .vigil .piece.full { position: fixed; inset: 0 !important; z-index: 50; width: auto !important; height: auto !important; margin: 0; justify-self: stretch; align-self: stretch; background: #0b0b0d; }   /* stretch: centring would shrink a fixed box to nothing */
.vigil .piece:fullscreen iframe, .vigil .piece.full iframe { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
html:has(.piece.full) { overflow: hidden; }
.piece .close { display: none; position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 2; width: 40px; height: 40px; padding: 0; border: 1px solid rgb(236 230 221 / .25); border-radius: 50%; background: rgb(11 11 13 / .55); color: #ece6dd; font: 400 20px/1 var(--mono); cursor: pointer; }
.piece:fullscreen .close, .piece.full .close { display: grid; place-items: center; }
/* a family as a row: the open piece in the middle, its siblings on either side as they hang, faded, all drawn live by one
   piece (the strip, .fam) across the row's span, its ends fading out. Over it, the row: a sideways scroller (trackpad, touch,
   or dragged with the mouse) of empty panels that snaps to a piece and tells the strip where they are. Alone, the strip
   shows one piece, and takes clicks itself (a click drops a stone, as on a lone piece). */
.vigil .piece iframe.fam { inset: auto; pointer-events: none; }
.vigil .piece iframe.fam:not(.inrow) { pointer-events: auto; }
.piece .fam.inrow { -webkit-mask: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); mask: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); }
.piece .row { position: absolute; z-index: 1; top: 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
  cursor: grab; user-select: none; -webkit-user-select: none; outline-offset: -2px; }
.piece .row::-webkit-scrollbar { display: none; }
.piece .row.dragging { scroll-snap-type: none; cursor: grabbing; }
.piece .row .track { position: relative; height: 100%; }
.piece .row .panel { position: absolute; scroll-snap-align: start; }

.piece .steps { position: absolute; z-index: 2; display: flex; justify-content: space-between; pointer-events: none; }
.piece .steps button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-2); cursor: pointer; pointer-events: auto; }
.piece .steps button:hover { color: var(--ink); }

.piece .steps svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

 display: grid; gap: 2px; }\n.pal .n, .sib .n { color: var(--ink-2); font-size: 11px; }\n.pal:hover .sw, .pal.pick .sw, .sib:hover img, .sib.pick img { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--ink); }\n.pal.on .pn > span:first-child, .sib.on .pn > span:first-child { color: var(--accent); }\n\n/* the example families: each a row of its panels, set edge to edge as they hang, so the lines can be followed across the cuts\n   (the thumbnails are the panels' artwork, inside their frames, rendered at 21:00) */\n.family { display: grid; grid-template-columns: repeat(var(--n), minmax(0, var(--w))); gap: 3px; margin: 0 0 22px; }\n.sib { display: grid; gap: 6px; min-width: 0; padding: 0; border: 0; background: none; color: var(--ink); text-align: left; font: 400 11px/1.3 var(--mono); cursor: pointer; }\n.sib img { display: block; width: 100%; height: auto; }\n/* a new family: the button, the number of its pieces, and the family on display as a row of thumbnails (the stills of the\n   row beside the text, so a piece still being rendered shows as a blank) */\n.count { display: inline-flex; align-items: center; gap: 6px; }\n.count output { min-width: 6.4em; text-align: center; font: 400 12px/1 var(--mono); letter-spacing: .02em; font-variant-numeric: tabular-nums; }\n.chip.step { justify-content: center; width: 36px; padding: 0; font-size: 14px; }\n.famview .ph { display: block; width: 100%; background: rgb(42 36 33 / .07); }\n.chip:disabled { opacity: .35; cursor: default; box-shadow: inset 0 0 0 1px var(--rule); }\n/* the messenger's switch: its knob is the messenger, red and to the right while it shows */\n.switch .n { min-width: 3ch; text-align: left; }                    /* (on and off take the same room, so the chip keeps its width) */\n.switch circle { transition: transform .2s, fill .2s, stroke .2s; }\n.switch[aria-checked=\"true\"] circle { transform: translateX(12px); fill: var(--accent); stroke: var(--accent); }\n@media (prefers-reduced-motion: reduce) { .sw 0 0 1 7.7 0a5.1 5.1 0 0 1-10.2 0a6.35 6.35 0 0 1 12.7 0\"/>\u003ccircle cx=\"12.4\" cy=\"8\" r=\"1.1\"/>\u003c/symbol>\n  \u003csymbol id=\"b-whorl-hole\" viewBox=\"0 0 24 16\">\u003cpath d=\"M15 8a2.6 2.6 0 0 1-5.2 0a3.85 3.85 0 0 1 7.7 0a5.1 5.1 0 0 1-10.2 0a6.35 6.35 0 0 1 12.7 0\"/>\u003ccircle class=\"solid\" cx=\"12.4\" cy=\"8\" r=\"1.5\"/>\u003c/symbol>\n\u003c/svg>\n\n\u003cdiv class=\"view vigil-view\">\n  \u003cdiv class=\"vigil\">\n    \u003cdiv class=\"piece\">\u003cbutton class=\"close\" type=\"button\" aria-label=\"Close full screen\">×\u003c/button>\u003c/div>\n    \u003cdiv class=\"vigil-text\">\n      \u003cdiv class=\"vigil-intro\">\n      \u003cp class=\"eyebrow\">2026 · generative · in progress\u003c/p>\n      \u003ch2>vigil\u003c/h2>\n      \u003cdiv class=\"lede\">\n        \u003cp>A long-form generative series, in which every seed is a piece of its own: printed gravel flowing in layered bands, with spheres, black holes and eclipses resting on it. Nothing is stored as an image. Your browser draws the piece as it opens, and its colors follow the light of the hour in which you are looking at it.\u003c/p>      \u003c/div>\n      \u003cp class=\"piece-bar\">\n        \u003cbutton class=\"btn\" type=\"button\" data-vigil=\"new\">new seed\u003c/button>\n        \u003cbutton class=\"btn ghost\" type=\"button\" data-vigil=\"full\">full screen\u003c/button>\n        \u003cbutton class=\"btn ghost\" type=\"button\" data-vigil=\"row\" hidden>whole family\u003c/button>\n      \u003c/p>\n      \u003cform class=\"keep-bar\" data-vigil=\"open\">\n        \u003cbutton class=\"btn ghost\" type=\"button\" data-vigil=\"save\">save still\u003c/button>\n        \u003cspan class=\"seed-in\">\u003cinput name=\"seed\" type=\"text\" placeholder=\" \" aria-label=\"A seed to open\" autocomplete=\"off\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\" enterkeyhint=\"go\">\u003cspan class=\"hint\" aria-hidden=\"true\">type a seed\u003c/span>\u003cbutton type=\"submit\">open\u003c/button>\u003c/span>\n      \u003c/form>\n      \u003cp class=\"mint-bar\">\u003cbutton class=\"btn soon\" type=\"button\" disabled>minting soon\u003c/button>\u003c/p>\n      \u003c/div>\n\n      \u003cdiv class=\"vigil-notes\">\n      \u003csection class=\"onscreen\" aria-label=\"The piece on screen\">\n        \u003cp class=\"kicker\">on screen\u003cb data-v=\"seed\">\u003c/b>\u003c/p>\n        \u003cdl data-v=\"traits\">\u003c/dl>\n      \u003c/section>\n\n      \u003csection class=\"note\">\n        \u003ch3>The seed\u003c/h3>\n        \u003cp>Each piece grows out of a seed, a code of ten characters such as rvtjsrtths, and the seed decides all of it: the format, the way the bands are laid out and where they meet, the palette and the gravel, the place of every sphere and every engraved line. The same seed will always give the same piece. There are some 819 trillion such codes, and yet none of them is kept as an image anywhere; the piece is computed in your browser at the moment it opens and goes on flowing for as long as it is left open. A click or a tap lets a small sphere fall into the gravel.\u003c/p>\n        \u003cp>The traits below are what a seed is able to decide, each with the share of random seeds in which it turns up, and those the piece on screen has are marked in red. A click on a trait opens a piece that has it: first an example chosen for it, and with every click after that a random seed that has the same trait.\u003c/p>\n      \u003c/section>\n\n      \u003csection class=\"note\">\n        \u003ch3>Gravel\u003c/h3>\n        \u003cp class=\"glabel\">size\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"tmb6s8f5zj\" data-trait=\"Gravel\" data-value=\"Fine\">\u003csvg>\u003cuse href=\"#g-fine\"/>\u003c/svg>fine\u003cspan class=\"n\">37%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"2fys6a55dm\" data-trait=\"Gravel\" data-value=\"Medium\">\u003csvg>\u003cuse href=\"#g-medium\"/>\u003c/svg>medium\u003cspan class=\"n\">23%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"g8car2rxvb\" data-trait=\"Gravel\" data-value=\"Coarse\">\u003csvg>\u003cuse href=\"#g-coarse\"/>\u003c/svg>coarse\u003cspan class=\"n\">17%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"4n26a7ba7h\" data-trait=\"Gravel\" data-value=\"Mixed\">\u003csvg>\u003cuse href=\"#g-mixed\"/>\u003c/svg>mixed\u003cspan class=\"n\">23%\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cp class=\"glabel\">cut\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"9tcys65ku6\" data-trait=\"Cut\" data-value=\"Sand\">sand\u003cspan class=\"n\">60%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"svwytrzjvf\" data-trait=\"Cut\" data-value=\"Paper\">paper\u003cspan class=\"n\">40%\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cp class=\"glabel\">engraved bands\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"cywgf5h9nv\" data-trait=\"Lines\" data-value=\"Hatch\">hatch\u003cspan class=\"n\">30%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"g52tdjyq6u\" data-trait=\"Lines\" data-value=\"Contour\">contour\u003cspan class=\"n\">26%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"ftnqx3pug3\" data-trait=\"Lines\" data-value=\"Kanji\">kanji\u003cspan class=\"n\">1.5%\u003c/span>\u003c/button>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"note\">\n        \u003ch3>Bands and edges\u003c/h3>\n        \u003cp class=\"glabel\">folds\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"nuzh4jgzh 9tcys65ku6\" data-trait=\"Planets\" data-value=\"none\">none\u003cspan class=\"n\">19%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"g52tdjyq6u\" data-trait=\"Planets\" data-value=\"Few\">a few\u003cspan class=\"n\">34%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"fmxb3nsqym\" data-trait=\"Planets\" data-value=\"Scattered\">scattered\u003cspan class=\"n\">31%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"8am93aghn3\" data-trait=\"Planets\" data-value=\"Shoal\">shoal\u003cspan class=\"n\">16%\u003c/span>\u003c/button>\n        \u003c/div>\n        \u003cp class=\"glabel\">giants and whorls\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"uyf4s4mjh7\" data-trait=\"Giant\" data-value=\"Disc\">\u003csvg>\u003cuse href=\"#b-disc\"/>\u003c/svg>disc\u003cspan class=\"n\">10%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"b2jz6m8zvu\" data-trait=\"Giant\" data-value=\"Black hole\">\u003csvg>\u003cuse href=\"#b-hole\"/>\u003c/svg>black hole\u003cspan class=\"n\">10%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"uv5twvydy6\" data-trait=\"Giant\" data-value=\"Eclipse\">\u003csvg>\u003cuse href=\"#b-eclipse\"/>\u003c/svg>eclipse\u003cspan class=\"n\">8%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"2cs8vfgz6r\" data-trait=\"Centre\" data-value=\"Planet\">\u003csvg>\u003cuse href=\"#b-whorl-sphere\"/>\u003c/svg>whorl, sphere\u003cspan class=\"n\">5%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"6g5yyapapq\" data-trait=\"Centre\" data-value=\"Black hole\">\u003csvg>\u003cuse href=\"#b-whorl-hole\"/>\u003c/svg>whorl, black hole\u003cspan class=\"n\">4%\u003c/span>\u003c/button>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"note\">\n        \u003ch3>Rarities\u003c/h3>\n        \u003cp class=\"rare-line\">Dust: The gravel is ground nearly to powder, finer than in any other piece.\u003c/p>\n        \u003cp class=\"rare-line\">Boulders: The gravel grows far beyond its usual sizes, coarser than in any other piece.\u003c/p>\n        \u003cp class=\"rare-line\">Starfield: White star specks lie in the gravel many times more densely than in any other piece, or, on the light palettes, larger specks of their ink.\u003c/p>\n        \u003cp class=\"rare-line\">Sediment: The piece is divided into fourteen to sixteen thin bands, or ten to twelve in the aurora pieces.\u003c/p>\n        \u003cp class=\"rare-line\">Gilded: Every band is printed in gold on a ground of black lacquer.\u003c/p>\n        \u003cp class=\"rare-line\">Daybreak: Where the palette belongs to the night, the night gives way at a single horizon to the matching paper palette, so that dark and light each hold about half of the piece.\u003c/p>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"4yxg8jkuey\" data-trait=\"Rare\" data-value=\"Dust\">dust\u003cspan class=\"n\">2.4%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"nn87qmpsbn\" data-trait=\"Rare\" data-value=\"Boulders\">boulders\u003cspan class=\"n\">2.3%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"xn28rafsjn\" data-trait=\"Rare\" data-value=\"Starfield\">starfield\u003cspan class=\"n\">1.5%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"aggvjxd5ft\" data-trait=\"Rare\" data-value=\"Sediment\">sediment\u003cspan class=\"n\">1.5%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"dx47bpdc9j\" data-trait=\"Rare\" data-value=\"Gilded\">gilded\u003cspan class=\"n\">1.1%\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-seed=\"gxvn7eqqm8\" data-trait=\"Rare\" data-value=\"Daybreak\">daybreak\u003cspan class=\"n\">1.1%\u003c/span>\u003c/button>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"note\">\n        \u003ch3>Light of the hour\u003c/h3>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip\" type=\"button\" data-hour=\"3\">night\u003cspan class=\"n\">03:00\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-hour=\"6.5\">dawn\u003cspan class=\"n\">06:30\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-hour=\"15\">afternoon\u003cspan class=\"n\">15:00\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-hour=\"19\">dusk\u003cspan class=\"n\">19:00\u003c/span>\u003c/button>\n          \u003cbutton class=\"chip\" type=\"button\" data-hour=\"now\">your clock\u003c/button>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"note\">\n        \u003ch3>Families\u003c/h3>\n        \u003cp>Each wallet can mint up to twenty pieces. A single piece stands on its own, but two or more minted by the same wallet form a family and become the panels of one wide artwork, hung side by side in the order in which they were minted, so that a family of five is one artwork five panels wide.\u003c/p>\n        \u003cp class=\"glabel\">two pieces · curtain, arches · 1:1\u003c/p>\n        \u003cdiv class=\"family\" data-family=\"2fys6a55dm\" data-fn=\"2\" style=\"--n:2;--w:170px\">\n          \u003cbutton class=\"sib\" type=\"button\" data-fi=\"0\" data-seed=\"2fys6a55dm\" aria-label=\"piece 1 of 2, black sand\" title=\"piece 1 of 2, black sand\">\u003cimg src=\"data:image/webp;base64,UklGRgopAABXRUJQVlA4WAoAAAAgAAAA5QAA5QAASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA u003cdiv class=\"chips famnew\">\n          \u003cbutton class=\"chip\" type=\"button\" data-vigil=\"family\" aria-pressed=\"false\">new family\u003c/button>\n          \u003cspan class=\"count\" role=\"group\" aria-label=\"pieces in the family\">\n            \u003cbutton class=\"chip step\" type=\"button\" data-vigil=\"fewer\" aria-label=\"one piece fewer\">−\u003c/button>\n            \u003coutput aria-live=\"polite\">5 pieces\u003c/output>\n            \u003cbutton class=\"chip step\" type=\"button\" data-vigil=\"more\" aria-label=\"one piece more\">+\u003c/button>\n          \u003c/span>\n        \u003c/div>\n        \u003cdiv class=\"famview\" hidden>\n          \u003cp class=\"glabel\">\u003c/p>\n          \u003cdiv class=\"family\" data-family=\"\" data-fn=\"0\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"chips\">\n          \u003cbutton class=\"chip switch\" type=\"button\" role=\"switch\" aria-checked=\"false\" aria-label=\"messenger\" data-vigil=\"messenger\">\u003csvg viewBox=\"0 0 24 16\">\u003crect x=\".55\" y=\"2.55\" width=\"22.9\" height=\"10.9\" rx=\"5.45\"/>\u003ccircle cx=\"6\" cy=\"8\" r=\"2.7\"/>\u003c/svg>messenger\u003cspan class=\"n\">off\u003c/span>\u003c/button>\n        \u003c/div>\n      \u003c/section>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n","piece":"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n\u003ctitle>Vigil Hours\u003c/title>\n\u003cstyle>\n/* Single dark look on purpose: this is a viewing room for the art. */\n:root{\n  --bg:#0b0b0d; --panel:rgba(20,19,22,.86); --fg:#efe6d9; --dim:#a39a90; --line:rgba(239,230,217,.14);\n  --accent:#e0655c; --good:#9cc7a4; --warn:#e3b06a; --bad:#e0655c; --btn:rgba(239,230,217,.07); --btn-h:rgba(239,230,217,.14);\n  color-scheme:dark;\n}\n*{box-sizing:border-box}\n[hidden]{display:none!important}\nhtml,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);\n  font:12px/1.45 ui-monospace,\"SF Mono\",Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none}\n#stage{position:fixed;inset:0;touch-action:none}\n#stage canvas{position:absolute;display:block}\n.panel{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;\n  padding:10px 12px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}\n#hud{left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:316px;max-width:calc(100vw - 24px)}\n#hud.min .body{display:none}\n/* embedded in a page (?embed=1, e.g. on 0010.art): the piece sits on the host page's paper like a print, panel collapsed */\nhtml.embed,html.embed body{background:transparent}\nhtml.embed{color-scheme:light}   /* a dark scheme inside a light page makes browsers paint an opaque backdrop */\nhtml.embed #mini{display:none}\nhtml.embed #hud{display:none}   /* embedded, the piece shows no panel; the host page has its own buttons */\n.hrow{display:flex;align-items:center;gap:8px;justify-content:space-between}\n.ttl{letter-spacing:.09em;text-transform:uppercase;font-size:11px;color:var(--dim)}\nbutton{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer}\nbutton:hover{background:var(--btn-h)}\nbutton:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\nbutton:disabled{opacity:.4;cursor:not-allowed}\n#min{padding:2px 8px}\n.stat{font-size:22px;letter-spacing:-.01em;margin:8px 0 0;font-variant-numeric:tabular-nums}\n.stat small{font-size:11px;color:var(--dim);letter-spacing:0}\n.dim{color:var(--dim)}\n.tab{font-variant-numeric:tabular-nums}\ninput[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}\n.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0}\n.kv span{overflow-wrap:anywhere}\n.seedrow{display:flex;gap:6px;margin-top:4px}\n#seedIn{flex:1;min-width:0;font:inherit;color:var(--fg);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:6px 8px}\n#seedIn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n#seedIn::placeholder{color:var(--dim)}\n#stage.drop::after{content:\"Drop a saved still to reopen it\";position:fixed;inset:12px;display:grid;place-items:center;border:2px dashed var(--fg);border-radius:12px;background:rgba(11,11,13,.6);font-size:14px;pointer-events:none}\n.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}\n.acts button{flex:1 1 auto}\n.note{margin-top:8px;font-size:11px;color:var(--dim)}\n#bench{right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:300px;max-width:calc(100vw - 24px)}\n#bench table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}\n#bench th,#bench td{text-align:right;padding:3px 4px;border-bottom:1px solid var(--line)}\n#bench th:first-child,#bench td:first-child{text-align:left}\n#bench th{color:var(--dim);font-weight:normal}\n.g{color:var(--good)} .w{color:var(--warn)} .b{color:var(--bad)}\n#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;\n  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:none;max-width:calc(100vw - 32px)}\n@media (max-width:700px){\n  #hud{left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-width:none}\n  #bench{left:8px;right:8px;width:auto;max-width:none;top:calc(8px + env(safe-area-inset-top,0px))}\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"stage\">\u003ccanvas id=\"cv\">\u003c/canvas>\u003c/div>\n\n\u003cdiv id=\"hud\" class=\"panel\">\n  \u003cdiv class=\"hrow\">\u003cspan class=\"ttl\">Vigil · hours\u003c/span>\u003cspan class=\"hrow\">\u003cspan id=\"mini\" class=\"dim tab\">\u003c/span>\u003cbutton id=\"min\" title=\"Hide panel (H)\">–\u003c/button>\u003c/span>\u003c/div>\n  \u003cdiv class=\"body\">\n    \u003cdiv class=\"stat\">\u003cspan id=\"fps\">–\u003c/span> \u003csmall>fps\u003c/small>\u003c/div>\n    \u003cdiv class=\"dim tab\" id=\"ms\">&nbsp;\u003c/div>\n    \u003cdiv class=\"hrow\" style=\"margin-top:8px\">\u003cspan>pebble size\u003c/span>\u003cspan id=\"kv\" class=\"tab\">\u003c/span>\u003c/div>\n    \u003cinput id=\"k\" type=\"range\" min=\"50\" max=\"150\" step=\"1\" aria-label=\"Pebble size\">\n    \u003cdiv class=\"hrow\" style=\"margin-top:8px\">\u003clabel for=\"spd\">flow speed\u003c/label>\u003cspan id=\"spdv\" class=\"tab\">\u003c/span>\u003c/div>\n    \u003cinput id=\"spd\" type=\"range\" min=\"0\" max=\"100\" step=\"1\" aria-label=\"Flow speed\">\n    \u003cdiv class=\"hrow\" style=\"margin-top:8px\">\u003clabel for=\"hr\">light of the hour\u003c/label>\u003cspan>\u003cspan id=\"hrv\" class=\"tab\">\u003c/span> \u003cbutton id=\"hrLive\" title=\"Follow this computer's clock again\" style=\"padding:0 7px;font-size:11px;line-height:17px;margin-left:4px\" hidden>live\u003c/button>\u003c/span>\u003c/div>\n    \u003cinput id=\"hr\" type=\"range\" min=\"0\" max=\"23.99\" step=\"0.05\" aria-label=\"Hour of the light\">\n    \u003clabel for=\"seedIn\" class=\"dim\" style=\"display:block;margin-top:8px\">seed\u003c/label>\n    \u003cdiv class=\"seedrow\">\u003cinput id=\"seedIn\" type=\"text\" spellcheck=\"false\" autocomplete=\"off\" autocapitalize=\"off\" placeholder=\"seed, 0x… seed or saved filename\">\u003cbutton id=\"seedGo\">Load\u003c/button>\u003cbutton id=\"seedCopy\" title=\"Copy this seed\">Copy\u003c/button>\u003c/div>\n    \u003cdiv class=\"kv\">\u003cspan class=\"dim\">traits\u003c/span>\u003cspan id=\"traits\">\u003c/span>\u003c/div>\n    \u003cdiv class=\"acts\">\u003cbutton id=\"newSeed\">New seed\u003c/button>\u003cbutton id=\"save\">Save still\u003c/button>\u003cbutton id=\"openStill\">Open still\u003c/button>\u003cbutton id=\"benchBtn\">Benchmark\u003c/button>\u003c/div>\n    \u003cinput id=\"stillFile\" type=\"file\" accept=\"image/png\" hidden>\n    \u003cdiv class=\"note\">Click or tap to drop a stone into the flow. Paste a seed or a saved still's filename above, or drop a saved still on the page.\u003cbr>Keys: N new seed · S save · H hide · F frame rate (24 / 30 / 60 / full)\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003cdiv id=\"bench\" class=\"panel\" hidden>\u003c/div>\n\u003cdiv id=\"toast\">\u003c/div>\n\n\u003cscript>\n(() => {\n'use strict';\n\n/* ================================================================\n   Constants\n   ================================================================ */\nconst MARGIN = 0.028, CORNER = 0.012;      // frame\nconst MAXL = 16, MAXK = 8;                 // layers, steps in the shared edge profile (a family's panel may see more than a piece's three)\nconst MAXP = 22, MAXSTATIC = 16, MAXUSER = 6;\nconst SIDE = 1024, MAXN = 2400000;\nconst RELIEF = 0.0014, SHADE_K = 0.22;\nconst ACCENT_MIN = 35;                     // an accent band's ink differs from every band's own by at least this (CIE76 dE). At 11, against\n                                           // its own band only, a quarter of accents still read as the palette (2026-11-03)\nconst GROUND_MIN = 15;                     // ... and from its band's ground by at least this: deepened darker on a dark palette, an accent\n                                           // could sink into it (snc6bkjejn's back band went near-black navy on navy, 2026-11-03)\nconst isCoarse = matchMedia('(pointer: coarse)').matches;\nconst isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);\nconst EXPORT_W = (isCoarse || isSafari) ? 3200 : 4000, EXPORT_PX = (isCoarse || isSafari) ? 16e6 : 30e6;\nconst STILL_W = 1342;                      // the width the pebbles are sized for (the pebble shader's 1342.0): smaller stills are drawn at it and halved down\nconst LAMP = [0.1, 0.06];                  // light comes from the upper left\nconst GRAVITY = 0.14;                      // how far a sphere draws the gravel in toward it (black holes bend far more)\n\n// ground runs front -> back; the pebbles carry the light\nconst PALETTES = [\n  { name: 'Ember', w: 14, ground: ['#211617', '#080505'], light: '#f29a55', warm: '#ffdcaa', accent: '#ff4b2b', frame: '#0b0606', warmMix: 0.55, fiery: 1 },   // Ember and Rust, merged\n  { name: 'Cinnabar', w: 12, ground: ['#3a1210', '#120504'], light: '#f0c2a6', warm: '#ff6a3d', accent: '#ffb347', frame: '#120606', warmMix: 0.6, fiery: 1 },\n  { name: 'Magma', w: 12, ground: ['#1c1413', '#060404'], light: '#e2462f', warm: '#f5b04a', accent: '#ffe1a6', frame: '#0a0707', warmMix: 0.9, fiery: 1 },\n  { name: 'Rust', w: 10,   // retired: kept only so other seeds keep their palette roll; every Rust seed is reassigned (see makeScene)\n    ground: ['#2a1a14', '#0b0706'], light: '#d98458', warm: '#f0c793', accent: '#e0452f', frame: '#0d0907', warmMix: 0.5, fiery: 1 },\n  { name: 'Black sand', w: 10, ground: ['#171c26', '#06080b'], light: '#b8c2cf', warm: '#d6c6a4', accent: '#d8473d', frame: '#0a0c10', warmMix: 0.35, acc: ['#d8473d', '#d8473d', '#d6c6a4', '#8fa3b5'] },\n  { name: 'Indigo', w: 10, ground: ['#1a2040', '#070916'], light: '#c3cbea', warm: '#e3d2ae', accent: '#e2463b', frame: '#090a15', warmMix: 0.25, acc: ['#e2463b', '#e2463b', '#e3d2ae', '#9aa6d8'] },\n  { name: 'Ink', w: 8, ground: ['#1c1b1f', '#070709'], light: '#d6d0c4', warm: '#e6cfa2', accent: '#d9443b', frame: '#0b0b0d', warmMix: 0.4, acc: ['#d9443b', '#d9443b', '#e6cfa2', '#a8a29a'] },\n  { name: 'Abyss', w: 8, ground: ['#10252b', '#03080a'], light: '#b6e0e6', warm: '#d9ece6', accent: '#e5594e', frame: '#060b0d', warmMix: 0.2, acc: ['#e5594e', '#e5594e', '#d9ece6', '#4f8f96'] },\n  { name: 'Dusk', w: 8, ground: ['#282040', '#0a0813'], light: '#e2cedb', warm: '#efd6b3', accent: '#e2453a', frame: '#0c0a14', warmMix: 0.35, acc: ['#e2453a', '#e2453a', '#efd6b3', '#c8963e'] },   // ochre, was mauve #c79ac0 (deepened, it read as plum: 2026-11-04)\n  { name: 'Riso', w: 6, ground: ['#1e2548', '#0b0f23'], light: '#eee0c4', warm: '#e8893a', accent: '#ee3a2e', frame: '#0f1229', warmMix: 0.5, acc: ['#ee3a2e', '#e8893a', '#eee0c4', '#ee3a2e'] },\n  // light: paper grounds, and the pebbles are ink\n  { name: 'Parchment', w: 8, ground: ['#ece3d0', '#cdbd9f'], light: '#2b2624', warm: '#7a4a36', accent: '#c94f49', frame: '#f2ebdd', warmMix: 0.4, paper: 1, acc: ['#c94f49', '#c94f49', '#2b2624', '#7a4a36'] },\n  { name: 'Coral', w: 8, ground: ['#efe6d6', '#d9c7ad'], light: '#c75446', warm: '#8e3a31', accent: '#1f1d20', frame: '#f3ede2', warmMix: 0.5, paper: 1, acc: ['#c75446', '#1f1d20', '#8e3a31', '#d98458'] },\n  { name: 'Fog', w: 7, ground: ['#e4e6e2', '#bfc5c2'], light: '#2e3338', warm: '#56616a', accent: '#d4574f', frame: '#eceeea', warmMix: 0.5, paper: 1, acc: ['#d4574f', '#d4574f', '#2e3338', '#56616a'] },\n  { name: 'Sandstone', w: 7, ground: ['#e9d6b6', '#c7a57c'], light: '#5a3524', warm: '#a0482f', accent: '#1e1b1a', frame: '#f0e3cc', warmMix: 0.5, paper: 1, acc: ['#a0482f', '#1e1b1a', '#c97a4f', '#5a3524'] },\n];\n// Newer palettes, rolled from their own stream (see makeScene) so they don't reshuffle anyone else's palette\nconst LICHEN = { name: 'Lichen', ground: ['#1c1f15', '#070805'], light: '#c6c79d', warm: '#e4cf8e', accent: '#d9583a', frame: '#0a0b07', warmMix: 0.45, acc: ['#d9583a', '#d9583a', '#e4cf8e', '#8a9a5b'] };\nconst AIZOME = { name: 'Aizome', ground: ['#e2e7ea', '#c4ced6'], light: '#1f3552', warm: '#3e5f84', accent: '#c94f49', frame: '#eef1f3', warmMix: 0.5, paper: 1, acc: ['#c94f49', '#c94f49', '#1f3552', '#3e5f84'] };\n// From the artist's own work (0010.art): Face Value's rose and crimson, Curtains' lavender and slate, pink paper, sage ink on bone,\n// and one expansion into oxidised-copper green (rolled from their own stream, see makeScene)\nconst ROSE = { name: 'Rose', ground: ['#2a2324', '#100d0e'], light: '#d9a8a0', warm: '#e8d6c4', accent: '#c8343f', frame: '#121011', warmMix: 0.5, acc: ['#c8343f', '#c8343f', '#e8d6c4', '#9a3340'] };\nconst PERIWINKLE = { name: 'Periwinkle', ground: ['#23242c', '#0b0c10'], light: '#aaa9d6', warm: '#8197bb', accent: '#e59cb0', frame: '#0d0e12', warmMix: 0.6, acc: ['#e59cb0', '#e59cb0', '#f0e2cf', '#6f86b0'] };\nconst VERDIGRIS = { name: 'Verdigris', ground: ['#132320', '#050b0a'], light: '#7fb79c', warm: '#dfe6d6', accent: '#e0603c', frame: '#070d0c', warmMix: 0.35, acc: ['#e0603c', '#e0603c', '#ece6d6', '#3f8a7c'] };\nconst BLUSH = { name: 'Blush', ground: ['#ecd3cb', '#d8b2a8'], light: '#1f1b1d', warm: '#7a2f36', accent: '#c8343f', frame: '#f4e6e1', warmMix: 0.45, paper: 1, acc: ['#c8343f', '#c8343f', '#1f1b1d', '#6f86b0'] };\nconst SAGE = { name: 'Sage', ground: ['#dccfb6', '#c2b396'], light: '#4f6149', warm: '#262624', accent: '#c9533f', frame: '#efe6d4', warmMix: 0.45, paper: 1, acc: ['#c9533f', '#c9533f', '#262624', '#7f9a78'] };\n// daybreak (see makeScene): the paper each night palette turns to past the horizon\nconst DAY_TWIN = { 'Black sand': 'Fog', Ink: 'Parchment', Indigo: 'Aizome', Abyss: 'Fog', Dusk: 'Blush', Riso: 'Coral', Ember: 'Sandstone',\n  Cinnabar: 'Coral', Magma: 'Sandstone', Rust: 'Sandstone', Lichen: 'Sage', Rose: 'Blush', Periwinkle: 'Aizome', Verdigris: 'Sage' };\nconst PAL_BY_NAME = Object.fromEntries([...PALETTES, LICHEN, AIZOME, ROSE, PERIWINKLE, VERDIGRIS, BLUSH, SAGE].map(p => [p.name, p]));\nconst SHELL = '#ece6da', SLATE = '#2c2f36';\n\n// ---- helpers\nconst hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };\nconst mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];\nconst mulc = (a, s) => [a[0] * s, a[1] * s, a[2] * s];\nconst clamp = (x, a, b) => Math.min(b, Math.max(a, x));\nconst lab = c => {                                     // sRGB -> CIE Lab (D65), to judge how different two inks look\n  const [r, g, b] = c.map(v => (v = clamp(v, 0, 1)) \u003c= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);\n  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;\n  const X = f((r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047), Y = f(r * 0.2126 + g * 0.7152 + b * 0.0722), Z = f((r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883);\n  return [116 * Y - 16, 500 * (X - Y), 200 * (Y - Z)];\n};\nconst fromLab = ([L, A, B]) => {                     // CIE Lab (D65) -> sRGB (clipped), for deepening an accent\n  const fy = (L + 16) / 116, fx = fy + A / 500, fz = fy - B / 200, inv = t => t ** 3 > 0.008856 ? t ** 3 : (t - 16 / 116) / 7.787;\n  const X = inv(fx) * 0.95047, Y = inv(fy), Z = inv(fz) * 1.08883;\n  return [3.2406 * X - 1.5372 * Y - 0.4986 * Z, -0.9689 * X + 1.8758 * Y + 0.0415 * Z, 0.0557 * X - 0.2040 * Y + 1.0570 * Z]\n    .map(v => clamp(v \u003c= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055, 0, 1));\n};\nconst dE = (a, b) => { const p = lab(a), q = lab(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };   // CIE76 difference\n\nfunction xmur3(str) {\n  let h = 1779033703 ^ str.length;\n  for (let i = 0; i \u003c str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h \u003c\u003c 13 | h >>> 19; }\n  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; };\n}\nfunction hashFromString(s) { const g = xmur3('vigil:' + s); let o = '0x'; for (let i = 0; i \u003c 8; i++) o += g().toString(16).padStart(8, '0'); return o; }\nfunction randomHash() { const a = new Uint32Array(8); crypto.getRandomValues(a); let o = '0x'; for (const v of a) o += v.toString(16).padStart(8, '0'); return o; }\nclass Rand {\n  constructor(hash, salt) { const g = xmur3(hash + '|' + salt); this.a = g(); this.b = g(); this.c = g(); this.d = g(); for (let i = 0; i \u003c 15; i++) this.next(); }\n  next() {\n    let a = this.a >>> 0, b = this.b >>> 0, c = this.c >>> 0, d = this.d >>> 0;\n    let t = (a + b) | 0; a = b ^ b >>> 9; b = c + (c \u003c\u003c 3) | 0; c = (c \u003c\u003c 21 | c >>> 11); d = d + 1 | 0; t = t + d | 0; c = c + t | 0;\n    this.a = a; this.b = b; this.c = c; this.d = d; return (t >>> 0) / 4294967296;\n  }\n  r(a = 0, b = 1) { return a + (b - a) * this.next(); }\n  i(a, b) { return Math.floor(this.r(a, b + 1)); }\n  chance(p) { return this.next() \u003c p; }\n  weighted(items) { let s = 0; for (const it of items) s += it.w; let x = this.next() * s; for (const it of items) { x -= it.w; if (x \u003c= 0) return it; } return items[items.length - 1]; }\n}\n\n/* ================================================================\n   Scene: everything the seed decides\n   Every fold edge is the same shared profile P(b), placed with intent:\n   Parallel (exact copies), Fan (the steps grow steadily with depth) or Cascade (the steps shift steadily).\n   Fold space: a = across the folds, b = along them (the direction the gravel flows).\n   The whole material is then bent (a smooth organic warp) and, rarely, wound into a whorl.\n   ================================================================ */\nfunction profJS(sc, b) {\n  let a = sc.wave[0] * Math.sin(sc.wave[1] * b + sc.wave[2]) + sc.wave2[0] * Math.sin(sc.wave2[1] * b + sc.wave2[2]);\n  for (const s of sc.prof) { const z = clamp(((b - s.c) / s.w + 1) * 0.5, 0, 1); a += s.amp * z * z * (3 - 2 * z); }\n  const S = sc.shapeU, u = S[0] ? ((((b - S[3]) / S[1]) % 1) + 1) % 1 : 0, sm = x => x * x * (3 - 2 * x);\n  if (S[0] === 1) { const z = u * 2 - 1; a += S[2] * Math.sqrt(Math.max(1 - z * z, 0)); }                    // arches\n  else if (S[0] === 2) { const k = sc.shapeV[0]; a += S[2] * (u \u003c k ? sm(u / k) : 1 - sm((u - k) / (1 - k))); }   // dunes\n  return a;\n}\nfunction bndJS(sc, j, b, iron = 0) {\n  if (j \u003c 0) return -0.2;\n  if (j >= sc.N - 1) return sc.aMax + 0.2;\n  const E = sc.edges[j]; return E.base + E.s * (profJS(sc, b - E.shift) - sc.pMid) * (1 - iron);\n}\n// how far the bands relax into plain strata near a whorl (see ironAt in the shaders); x, y is the design point\nfunction ironJS(sc, x, y) {\n  const S = sc.swirl, ss = (lo, hi, d) => { const z = clamp((d - lo) / (hi - lo), 0, 1); return z * z * (3 - 2 * z); };\n  let k = 0;\n  if (S[2]) { const T = Math.abs(S[2]); k = 1 - ss(S[3] * (1.4 + 0.13 * T), S[3] * (2.8 + 0.22 * T), Math.hypot(x - S[0], y - S[1])); }\n  for (const o of sc.stones || []) if (o.kind === 2) { const RE = o.r * Math.sqrt(o.lens); k = Math.max(k, 1 - ss(0.7 * RE, 1.8 * RE, Math.hypot(x - o.x, y - o.y))); }\n  return k;\n}\n// design point -> material point (undo the lenses, then the whorl, then the bend by fixed-point iteration)\nfunction mapIJS(sc, x, y) {\n  for (const o of sc.stones || []) {\n    if (!o.lens) continue;\n    const vx = x - o.x, vy = y - o.y;\n    if (o.kind === 2 && !o.soft) { const f = 1 - o.lens * o.r * o.r / Math.max(vx * vx + vy * vy, o.r * o.r * 0.09); x = o.x + vx * f; y = o.y + vy * f; continue; }\n    const dp = Math.hypot(vx, vy); let dq = dp;\n    for (let i = 0; i \u003c 3; i++) dq = dp / (1 - o.lens * Math.exp(-dq * dq / (o.r * o.r * 3.2)));\n    const f = dp > 1e-9 ? dq / dp : 1; x = o.x + vx * f; y = o.y + vy * f;\n  }\n  const S = sc.swirl;\n  if (S[2]) {\n    const dx = x - S[0], dy = y - S[1], th = -S[2] * Math.pow(1 + (dx * dx + dy * dy) / (S[3] * S[3]), -1.5), c = Math.cos(th), s = Math.sin(th);\n    x = S[0] + c * dx - s * dy; y = S[1] + s * dx + c * dy;\n  }\n  let qx = x, qy = y;\n  for (let i = 0; i \u003c 4; i++) {\n    let bx = 0, by = 0;\n    for (const w of sc.bend) { const sn = Math.sin(qx * w.kx + qy * w.ky + w.ph); bx += w.ax * sn; by += w.ay * sn; }\n    qx = x - bx; qy = y - by;\n  }\n  return [qx, qy];\n}\n\n// ---- light hour: every piece follows the viewer's local time of day. Deep night (3 am) is darker and cooler, dawn and dusk\n// glow rose-violet like an afterglow sky, midday is clearest. Paper is cool window light by day and lamplight by night; ink\n// keeps its colour. The shift is about two-thirds of the strongest mock, so each palette stays recognisable.\nfunction hourTint(c, dots, paper, h) {\n  const night = 0.5 + 0.5 * Math.cos(2 * Math.PI * (h - 3) / 24), day = 1 - night;                    // night: 1 at 3 am, 0 at 3 pm\n  const twi = Math.max(Math.exp(-(((h - 6.5) / 1.6) ** 2)), Math.exp(-(((h - 19) / 1.6) ** 2)),          // dawn and dusk\n                       Math.exp(-(((h + 24 - 19) / 1.6) ** 2)), Math.exp(-(((h - 24 - 6.5) / 1.6) ** 2)));   // (wrapping round midnight)\n  if (paper) {\n    if (dots) return mixc(mixc(c, hex('#4a2442'), 0.16 * twi), hex('#3a2416'), 0.12 * night);\n    return mixc(mixc(mixc(c, hex('#eef1f4'), 0.36 * day), hex('#ddb47a'), 0.34 * night), hex('#e6b4cc'), 0.34 * twi);\n  }\n  if (dots) return mixc(mixc(mulc(c, 0.87 + 0.27 * day), hex('#d99ac8'), 0.24 * twi), hex('#9cb2f0'), 0.2 * night);\n  return mixc(mixc(mulc(c, 1.13 - 0.27 * night), hex('#3c1838'), 0.36 * twi), hex('#0b1634'), 0.37 * night);\n}\n\n// ---- a family is one wide piece cut into panels, one per piece, hung in mint order. The first piece is the first panel,\n// exactly as it is on its own; the wide piece carries its bands on to the right, and every later piece is the next panel,\n// coloured from its own seed. Panel k shows the wide piece from x = k * SPAN on (a panel's art width; the frames sit at the\n// cuts), so the lines run on from panel to panel exactly. All of it follows from the first piece and a panel's place,\n// never from the family's size, so no panel changes as the family grows.\nconst SPAN = 1 - 2 * MARGIN;\nconst WIDE = new Map();\nfunction wideOf(fam) {\n  let W = WIDE.get(fam); if (W) return W;\n  if (WIDE.size > 3) WIDE.clear();                   // (a page shows one family at a time)\n  const sc0 = makeScene(fam, null), F = sc0.first;\n  W = { fam, sc0, F, slots: [F.prof], cum: [0], lines: null };\n  // side to side: the edge's steps go on panel after panel in the first piece's manner, climbing and falling within about\n  // the height the first piece's own steps span, so the bands never drift off the panels\n  const amps = F.prof.map(s => Math.abs(s.amp)), ws = F.prof.map(s => s.w);\n  let lev = 0, lo = 0, hi = 0, last = 0;\n  for (const s of [...F.prof].sort((a, b) => a.c - b.c)) { lev += s.amp; lo = Math.min(lo, lev); hi = Math.max(hi, lev); last = Math.sign(s.amp); }\n  const mid = (lo + hi) / 2, half = Math.max((hi - lo) / 2, 0.06 * F.aMax), mean = a => a.reduce((x, y) => x + y, 0) / a.length;\n  // the first piece reads its material a little past its right edge (its bend, and its spheres' pull, draw it in), and each\n  // line reads the edge shifted along it: the wide piece's new steps and folds start beyond that, so they never reach back in\n  let seen = 1 - MARGIN;\n  for (let s = 0; s \u003c= 120; s++) for (const dx of [0, 0.03, 0.08]) seen = Math.max(seen, mapIJS(sc0, 1 - MARGIN - dx, F.H * s / 120)[0]);\n  W.seen = seen;\n  const reachBack = seen + Math.max(0, ...F.edges.map(E => Math.abs(E.shift))) + 0.04;\n  W.slot = m => {                                    // the steps of panel m, in wide-piece units\n    while (W.slots.length \u003c= m) {\n      const k = W.slots.length, RW = new Rand(fam, 'wide:steps:' + k), out = [];\n      W.cum.push(W.cum[k - 1] + W.slots[k - 1].reduce((a, s) => a + s.amp, 0));\n      if (amps.length && F.orient === 1 && !F.rings) {\n        const w0 = mean(ws) * 1.25, from = Math.max(0.1, reachBack + w0 - k * SPAN), room = 0.9 - from;\n        const K = room \u003c 0.12 ? (room > 0 ? 1 : 0) : F.edge === 'Drift' ? RW.i(2, 3) : F.aurora && F.edge !== 'Staircase' ? 1 : RW.i(1, 3);\n        for (let j = 0; j \u003c K; j++) {\n          const mag = mean(amps) * RW.r(0.75, 1.25), d = lev - mid;\n          let sg = F.edge === 'Zigzag' ? -last : Math.abs(d) > 0.3 * half && RW.chance(0.8) ? -Math.sign(d) : RW.chance(0.5) ? 1 : -1;\n          if (Math.abs(lev + sg * mag - mid) > half + 0.03 * F.aMax) sg = -sg;\n          out.push({ c: k * SPAN + from + (0.9 - const ring = document.createElement('div');\n  Object.assign(ring.style, { position: 'fixed', zIndex: 4, borderRadius: '50%', pointerEvents: 'none', display: 'none', boxSizing: 'border-box' });\n  document.body.appendChild(ring);\n  const raf = () => new Promise(r => requestAnimationFrame(r));\n  window.__rec = {\n    load(seed) { const r = parseSeed(seed); if (r.error) throw new Error(r.error); loadSeed(r.hash, r.label, 0); user = []; return scene.traits; },\n    // cam: zoom (1 = the whole piece fitted with a margin), fx/fy focal point in design units (x 0..1, y 0..H), margin, ss supersampling\n    async frame(t, cam = {}) {\n      const vw = innerWidth, vh = innerHeight, H = scene.H, m = cam.margin ?? 0.07, z = cam.zoom ?? 1;\n      let w = vw * (1 - 2 * m), h = w * H; if (h > vh * (1 - 2 * m)) { h = vh * (1 - 2 * m); w = h / H; }\n      const fx = cam.fx ?? 0.5, fy = cam.fy ?? H / 2;\n      let sx = (vw - w) / 2 + fx * w, sy = (vh - h) / 2 + fy / H * h;     // the focal point keeps its place on screen while zooming,\n      const an = cam.anchor ?? 0; sx += (vw / 2 - sx) * an; sy += (vh / 2 - sy) * an;   // or drifts toward the centre (anchor 0..1)\n      const W = w * z, Hh = h * z;\n      Object.assign(cv.style, { width: W + 'px', height: Hh + 'px', left: (sx - fx * W) + 'px', top: (sy - fy / H * Hh) + 'px' });\n      const ss = Math.min(cam.ss ?? 2, Math.sqrt((cam.maxPx ?? 14e6) / (W * Hh)));\n      const bw = Math.max(64, Math.round(W * ss)), bh = Math.round(bw * H);\n      if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }\n      if (cam.ring) {\n        const a = cam.ring.age, k = Math.min(1, a / 0.7), e = 1 - Math.pow(1 - k, 3), d = 16 + 150 * e;   // a ripple that opens past the planet\n        Object.assign(ring.style, { display: a >= 0 && a \u003c 0.7 ? 'block' : 'none', width: d + 'px', height: d + 'px',\n          left: (sx - fx * W + cam.ring.x * W - d / 2) + 'px', top: (sy - fy / H * Hh + cam.ring.y / H * Hh - d / 2) + 'px', <script>
(() => {
  const $ = s => document.querySelector(s);
  const P = JSON.parse($('#payload').textContent);
  // An open page (sync-site.mjs builds it so since 2026-11-05) carries the notes and the piece as they are, and the lock's
  // markup is left out of it: they show at once. A password from an older shared link (#k=…) is simply taken away.
  if (P.html) {
    if (/^#k=/.test(location.hash)) history.replaceState(null, '', location.pathname);
    show(P);
    return;
  }
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = $('.lock .msg'), input = $('.lock input');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'this page needs a secure (https) connection'; return; }

  // the password stretches into an AES key (PBKDF2, many rounds, so guessing is slow); a wrong password fails the GCM check
  const decrypt = async pw => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data))));
  };
  const open = async (pw, quiet) => {
    if (!pw) return;
    msg.textContent = 'opening…';
    try {
      const data = await decrypt(pw);
      try { sessionStorage.setItem('vigil-key', pw); } catch { }   // this tab only: a reload doesn't ask again
      show(data);
    } catch {
      try { sessionStorage.removeItem('vigil-key'); } catch { }
      msg.textContent = quiet ? '' : 'that isn’t it'; input.select();
    }
  };
  $('.lock form').addEventListener('submit', e => { e.preventDefault(); open(input.value); });
  // A shared link may carry the password after # (#k=…): browsers never send that part to the server. It is taken out of
  // the address bar as soon as it is read.
  const m = location.hash.match(/^#k=(.+)$/);
  let kept = null; try { kept = sessionStorage.getItem('vigil-key'); } catch { }
  if (m) { history.replaceState(null, '', location.pathname); open(decodeURIComponent(m[1])); }
  else if (kept) open(kept, true);
  else input.focus();

  function show(data) {
    $('#app').innerHTML = data.html;
    document.title = 'vigil — 0010';
    const piece = $('.vigil .piece'), text = $('.vigil-text'), PAD = 28, stacked = matchMedia('(max-width: 900px)');
    let shape = null, waiting = [];
    // What the frame shows: its seed and traits (as the piece reports them), a pinned hour (null: the viewer's clock), and the
    // place in the notes' example family, if any ({ id, n, i, shift, keep }, shift moving the messenger's clock). pick: the trait
    // whose button the viewer clicked last ('Trait:Value'), until another piece takes over; beforeFam: the seed shown before
    // a family opened; msg: whether a family shows its messenger (the switch in the notes).
    const st = { seed: null, traits: null, hour: null, fam: null, timing: null, booting: true, pick: null, beforeFam: null, msg: true };
    let searchId = 0;
    // A family is drawn by a live piece of its own, the strip (see below): every piece of it side by side in one canvas, under
    // the row, which only scrolls. row: on (the whole family; off, one piece), its panels (empty boxes for the row to snap to),
    // its geometry, whether it is moving; thumbs: stills of a new family's pieces ({ url, light }).
    const row = { on: false, fam: null, panels: [], thumbs: [], shape: null, aw: 0, step: 0, xc: 0, top: 0, ah: 0, moving: false, drag: null, dragged: false, single: null, endT: 0, aim: null };
    let sf = null, sfNext = null;                      // the strip on screen, and one opening to take its place
    const frame = document.createElement('iframe');
    frame.title = 'vigil, a live generative piece';
    piece.append(frame);
    const withParams = q => data.piece.replace('<head>', `<head><script>window.__vigilParams = "${q}";<\/script>`);
    const boot = q => {                                // the lone piece (a family's strip stays on screen until it is ready)
      shape = null; st.booting = true; searchId++; frame.style.visibility = 'hidden';   // shown once it has reported its shape, so it never jumps
      frame.srcdoc = withParams(q);
    };
    boot('embed=1');                                   // the piece opens on a random seed
    const ready = () => st.booting ? new Promise(r => waiting.push(r)) : Promise.resolve();
    // A seed or an hour (or the light handed back to the clock) changes in place through the piece's own hooks (the frames
    // share this page's origin); leaving a family reopens the lone piece with its settings in the address.
    const lab = () => { if (st.booting) return null; try { return frame.contentWindow.__lab || null; } catch { return null; } };   // (not the page being replaced)
    const stripLab = () => { try { return sf && sf.contentWindow.__lab || null; } catch { return null; } };
    const reopen = () => {
      const q = new URLSearchParams({ embed: 1 });
      if (st.seed) q.set('seed', st.seed);
      if (st.hour !== null) q.set('hour', st.hour);
      boot(q.toString());
    };
    const openSeed = seed => {
      if (seed === st.seed && !st.fam) return;
      st.seed = seed;
      if (!st.fam && lab()) lab().load(seed); else { if (st.fam) { st.fam = null; hideRow(); } reopen(); }   // (out of a family: see leaveFamily)
    };
    const setHour = h => {
      st.hour = h;
      const L = st.fam ? stripLab() : lab();
      if (L) { L.setHour(h); mark(); } else if (!st.fam) reopen();   // (a strip still opening takes it once it reports)
      develop();                                       // (a new family's thumbnails follow the light)
    };

    // ---- traits: each button is one trait value ('Folds:Rings'); lines and bokashi combine with the others of their trait
    const spec = key => { const i = key.indexOf(':'); return { k: key.slice(0, i), v: key.slice(i + 1) }; };
    const keyOf = el => `${el.dataset.trait}:${el.dataset.value}`;
    const has = (t, key) => { const { k, v } = spec(key); return String((t || {})[k] ?? '').split(/ \+ | · /).includes(v); };
    // A random seed that has the trait: random codes through the piece's traitsOf, about 0.15 ms each (so some 140 tries,
    // 20 ms, for the rarest trait), 8 ms at a time so the piece keeps drawing.
    const ABC = 'abcdefghjkmnpqrstuvwxyz23456789';
    const randomCode = () => Array.from(crypto.getRandomValues(new Uint32Array(10)), v => ABC[v % 31]).join('');
    const find = async (L, key, id) => {
      for (const t0 = performance.now(); performance.now() - t0 < 4000; await new Promise(r => setTimeout(r))) {
        if (id !== searchId) return undefined;         // a newer click, or a new piece, took over
        for (const t1 = performance.now(); performance.now() - t1 < 8;) {
          const code = randomCode();
          if (code !== st.seed && has(L.traitsOf(code), key)) return code;
        }
      }
      return null;
    };
    const say = (el, msg) => {                         // a short line under the buttons when no seed tried had the trait
      for (const p of text.querySelectorAll('.vnote')) p.remove();
      if (!msg) return;
      const p = document.createElement('p');
      p.className = 'vnote'; p.setAttribute('role', 'status'); p.textContent = msg;
      el.closest('.chips, .pals').after(p);
    };
    // A button shows a piece that has its trait, one trait at a time, and stays outlined while that piece is on screen: the
    // first click on it opens its example from the notes, and every click after that a random seed that has the trait.
    const seen = new Set();                            // (the buttons whose example has been shown)
    const choose = async el => {
      const key = keyOf(el);
      if (st.fam) await leaveFamily();
      await ready();
      const L = lab(), id = ++searchId;
      if (!L || !L.traitsOf) { if (el.dataset.seed) openSeed(el.dataset.seed); return; }   // (a piece without its hooks: the example)
      const ex = el.dataset.seed;
      let seed = !seen.has(key) && ex && ex !== st.seed && has(L.traitsOf(ex), key) ? ex : null;
      seen.add(key);
      if (!seed) {
        const busy = setTimeout(() => el.setAttribute('aria-busy', 'true'), 150);   // (most searches end well before)
        seed = await find(L, key, id);
        clearTimeout(busy); el.removeAttribute('aria-busy');
        if (seed === undefined) return;
        if (!seed) { say(el, 'No seed tried had that.'); return; }
      }
      st.pick = key; openSeed(seed); say(el, ''); mark();
    };

    // ---- families: an example family's thumbnail, or "new family", opens the family as a row around one of its pieces;
    // a trait's button leaves the family
    // The messenger keeps one clock for the whole family: brought in at the left edge of the first piece when the family opens
    // (whichever piece was clicked), or of the piece on screen when it is switched on, it then goes its own way round,
    // whichever piece is on screen. Where it is: p seconds into its round, in piece floor(p / cross), where
    // p = (clock + shift + its offset) mod the loop (the piece's own arithmetic).
    const shiftTo = p => {                             // the clock shift that puts it p seconds into its round now
      const T = st.timing; if (!T) return null;
      return ((p - Date.now() / 1000 - T.phase) % T.loop + T.loop) % T.loop;
    };
    const entering = i => st.timing && shiftTo(i * st.timing.cross + 0.5);
    const roundAt = () => {                            // how far into its round it is now
      const T = st.timing; if (!T || !st.fam) return null;
      return ((Date.now() / 1000 + (st.fam.shift || 0) + T.phase) % T.loop + T.loop) % T.loop;
    };
    const seedOf = (fam, i) => i ? `${fam}-${i + 1}` : fam;   // a later piece's seed, as the examples name them
    let famSize = 5;                                   // the size of the next new family (2 to 20, a wallet's limit)
    // a family opens as a row around one of its pieces: its strip opens out of sight, and takes the place of what was on
    // screen (a lone piece, or another family) in one go once it has drawn
    const openFamily = (id, n, i, made) => {
      if (!st.fam) st.beforeFam = st.seed;
      st.timing = null; st.pick = null;                // (its messenger keeps its own timetable, learnt once it opens)
      st.fam = { id, n, i, shift: null, keep: null, made }; st.seed = seedOf(id, i);
      clearThumbs();                                   // (the last family's thumbnails are not this one's)
      row.on = true; openStrip(); mark();
    };
    const openSibling = b => { const F = b.closest('[data-family]').dataset; toPiece(F.family, +F.fn, +b.dataset.fi, false); };
    const toPiece = (id, n, i, made) => {
      if (st.fam && st.fam.id === id && i < st.fam.n) {
        if (st.fam.i === i && !row.moving) return;     // (the piece already open: unlike the other buttons, a second click leaves it be)
        if (!row.step) { focus(i); return; }           // (its strip still opening)
        if (!row.on) showRow();
        glide(i);                                      // another piece of the open family: the row moves to it
        return;
      }
      openFamily(id, n, i, made);
    };
    // leaving, the lone piece reopens; the family stays on screen (still, its row put away) until it is ready (see the messages below)
    const leaveFamily = () => {
      st.fam = null; st.seed = st.beforeFam; hideRow(); reopen();
      return ready();
    };
    // a family grows or shrinks by its last pieces (the others stay as they are); the piece on screen reopens, since the
    // messenger's round depends on the size. The messenger stays where it is (keep: how far into its round, and when), or,
    // if its piece was taken away, comes back in at the first.
    const resize = d => {
      const n = Math.min(20, Math.max(2, (st.fam ? st.fam.n : famSize) + d));
      famSize = n;
      if (st.fam && st.fam.n !== n) {
        const p = st.msg && st.fam.shift !== null ? roundAt() : null;
        st.fam.keep = p === null ? null : { p, t: Date.now() / 1000 };
        st.fam.n = n; st.fam.shift = null;
        if (st.fam.i >= n) { st.fam.i = n - 1; st.seed = seedOf(st.fam.id, st.fam.i); }
        while (row.thumbs.length > n) { const t = row.thumbs.pop(); if (t) URL.revokeObjectURL(t.url); }
        const L = stripLab();
        if (L && !sfNext) { L.strip.size(n); L.strip.focus(st.fam.i); buildRow(); fit(); }   // (it tells the messenger's new round)
        else openStrip();                              // (still opening, with the old size)
        develop();
      }
      mark();
    };
    const liveFrames = () => sf ? [sf] : [];
    const tell = f => {                                // (directly where it can, so it holds from the strip's next frame)
      const o = st.fam.shift === null ? { vigilMsg: st.msg } : { vigilShift: st.fam.shift, vigilMsg: st.msg };
      let L = null; try { L = f.contentWindow.__lab; } catch { }
      if (L && L.family) L.family(o); else f.contentWindow.postMessage(o, '*');
    };
    // the messenger's clock, once the piece on screen has told its timetable: kept where it was, or brought in at the start
    const setClock = () => {
      const K = st.fam.keep, T = st.timing; st.fam.keep = null;
      const p = K && K.p + Date.now() / 1000 - K.t;
      st.fam.shift = K && p < T.loop ? shiftTo(p) : entering(0);
      liveFrames().forEach(tell);
    };
    // the switch: on, the messenger comes in at the left edge of the piece on screen; off, it fades from every piece. With no
    // family open, it opens the first example family, the messenger coming in.
    const switchMessenger = () => {
      if (!st.fam) { st.msg = true; openSibling(text.querySelector('[data-fi="0"]')); return; }
      st.msg = !st.msg; st.fam.keep = null;
      if (st.msg && st.timing) st.fam.shift = entering(st.fam.i);
      liveFrames().forEach(tell);
      mark();
    };

    // ---- the strip: one live piece drawing the whole family (the piece's ?strip=1), in a frame across the row's span, under the
    // row. It is told where each piece shows (view) and which one is in the middle (focus), and reports that one's traits.
    const stripBox = () => {                           // (the row's span, as tall as the slot)
      const S = rowSpan(); return { left: `${S.X0}px`, top: '0px', width: `${S.X1 - S.X0}px`, height: `${piece.clientHeight}px` };
    };
    const openStrip = () => {
      if (sfNext) sfNext.remove();
      const f = sfNext = document.createElement('iframe');
      f.className = 'fam'; f.title = 'vigil, a family of live generative pieces'; f.style.visibility = 'hidden';
      Object.assign(f.style, stripBox());
      const q = new URLSearchParams({ embed: 1, strip: 1, seed: st.fam.id, family: st.fam.id, fi: st.fam.i, fn: st.fam.n });
      if (st.hour !== null) q.set('hour', st.hour);
      if (!st.msg) q.set('msg', 0);
      f.hour = st.hour; f.srcdoc = withParams(q.toString());
      piece.insertBefore(f, strip);
      st.booting = true; searchId++;
    };
    const takeStrip = () => {                          // the new strip has reported: it takes the place of what was on screen
      if (sf) sf.remove();
      sf = sfNext; sfNext = null;
      if (frame.srcdoc) { frame.removeAttribute('srcdoc'); frame.src = 'about:blank'; }   // (the lone piece is let go, its renderer with it)
      frame.style.visibility = 'hidden';
      clearRow(); buildRow();
      if (row.on) { strip.hidden = false; steps.hidden = false; }
      sf.style.visibility = '';
    };
    const dropStrip = () => {                          // the family is left: its strip goes once the lone piece is ready
      for (const f of [sf, sfNext]) if (f) f.remove();
      sf = sfNext = null;
      hideRow(); clearRow(); clearThumbs();
    };
    const clearThumbs = () => { for (const t of row.thumbs) if (t) URL.revokeObjectURL(t.url); row.thumbs = []; };
    const focus = i => {                               // another piece in the middle: only the strip is told
      st.fam.i = i; st.seed = seedOf(st.fam.id, i);
      stripLab()?.strip.focus(i);
      mark();
    };
    // where each piece shows: in the row, every one in view, the farther from the middle the fainter; alone, the one piece
    const view = () => {
      const L = stripLab(); if (!L || !st.fam || !row.aw) return;
      const items = [];
      if (row.on && row.step) {

      else if (b.dataset.vigil === 'row') { if (row.on) showOne(st.fam.i); else showRow(); return; }
      else return;
      // stacked, the piece sits above the notes: bring it into view to show what the button changed, and leave the way back.
      // Its top goes where a piece of the full height would sit centred, whatever its format (a new piece reports that only
      // once it has opened); by the window's own smooth scroll, since Chrome drops a smooth scrollIntoView once the row moves.
      if (stacked.matches) {
        const r = piece.getBoundingClientRect(), slot = Math.min(innerHeight * 0.76, 900);
        scrollTo({ top: scrollY + r.top - Math.max($('.bar').offsetHeight, (innerHeight - slot) / 2), behavior: smooth() });
        leaveMark(b, y);
      }
    });
    $('[data-vigil="new"]').addEventListener('click', () => {
      const wasFam = !!st.fam;
      st.fam = null; st.pick = null; say(text, ''); mark();
      if (wasFam || !lab()) { st.seed = null; hideRow(); boot('embed=1'); }   // (out of a family the lone piece reopens; the family stays until it is ready)
      else frame.contentWindow.postMessage('vigil:new', '*');
    });
    // A still of the piece in the middle, to keep: 4,000 px wide where the device allows it (the piece's own limit of 30
    // million pixels, 16 on phones and in Safari, takes it down there), a PNG carrying its seed, moment and light, as the
    // piece's own panel saves it. A family's piece is drawn by its strip, which gives it as a JPEG, without the messenger.
    // The file's name holds the seed, so the field beside the button opens the piece again from it.
    const SAVE_W = 4000, saver = $('[data-vigil="save"]');
    saver?.addEventListener('click', async () => {
      if (saver.hasAttribute('aria-busy')) return;
      await ready();
      const L = showing(), fam = st.fam, seed = st.seed;
      if (!L || !seed || (fam && (sfNext || !L.strip))) return;   // (a family's strip still opening)
      saver.style.width = `${saver.getBoundingClientRect().width}px`;   // (the shorter label leaves the field beside it where it is)
      saver.setAttribute('aria-busy', 'true'); saver.textContent = 'saving…';
      await new Promise(r => setTimeout(r, 30));      // (the label shows before the drawing holds the page)
      try {
        const t = +L.T.toFixed(1), h = +L.hour.toFixed(2);
        const blob = fam ? await L.strip.still(fam.i, SAVE_W)
          : await L.tagPNG((await L.R.exportPNG(L.ST, SAVE_W)).blob, JSON.stringify({ seed, t: +L.T.toFixed(3), h: +L.hour.toFixed(3) }));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = `vigil-gravel-${seed}-${t.toFixed(1)}s-${h.toFixed(2)}h.${fam ? 'jpg' : 'png'}`;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      } catch (e) { console.error(e); }
      saver.removeAttribute('aria-busy'); saver.textContent = 'save still'; saver.style.width = '';
    });
    // A seed typed or pasted in, or a saved still's name: it opens as the piece in the middle. A family's piece (<family>-2
    // to -20, as the families name them) opens its family around it, with as many pieces as the notes give that family, or
    // up to that piece for one they don't hold (a piece's look doesn't depend on its family's size).
    const seedIn = v => {
      let s = String(v).trim().replace(/^.*[\\/]/, '').replace(/(\s*\(\d+\))?\.(png|jpe?g)$/i, '');
      const m = s.match(/^vigil-[a-z]+-(.+?)-\d+(?:\.\d+)?s(?:-\d+(?:\.\d+)?h)?$/i); if (m) s = m[1];
      return /^[a-z0-9]{10}(-\d+)?$/i.test(s) ? s.toLowerCase() : s;   // (the codes are lower case; a phone may capitalise)
    };
    const opener = $('[data-vigil="open"]');
    opener?.addEventListener('submit', e => {
      e.preventDefault();
      const s = seedIn(opener.seed.value);
      if (!s) { opener.seed.focus(); return; }
      opener.seed.value = ''; opener.seed.blur();     // (a phone's keyboard goes away, and the piece shows below)
      st.pick = null; say(text, '');
      const f = s.match(/^([a-z0-9]{10})-([2-9]|1\d|20)$/);
      const ex = f && [...text.querySelectorAll(`[data-family="${f[1]}"]`)].find(el => !el.closest('.famview'));   // (not a new family's thumbnails)
      if (f) toPiece(f[1], Math.max(+f[2], ex ? +ex.dataset.fn : 0), +f[2] - 1, !ex); else openSeed(s);
      mark();
    });
    // full screen shows one piece (a row stays on the page); the layout follows it in and out (a lone piece fills its frame
    // there by itself, a family's strip is told where its piece goes)
    const overlay = on => { piece.classList.toggle('full', on); fit(); };
    $('[data-vigil="full"]').addEventListener('click', () => {
      if (row.on) { hideRow(); mark(); }
      if (piece.requestFullscreen) piece.requestFullscreen().catch(() => overlay(true));
      else overlay(true);
    });
    document.addEventListener('fullscreenchange', fit);
    $('.piece .close').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); overlay(false); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && piece.classList.contains('full')) overlay(false); });
  }
})();
</script>
</body>
</html>
