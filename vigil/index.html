<style>
/* A private page: its content is encrypted (AES-256-GCM, key from the password by PBKDF2-SHA256) and only decrypted
   in the browser. Generated by the vigil repo's tools/sync-site.mjs; edit the templates there, not this file. */
.bar { display: flex; }                                 /* the site shows its bar only on its own inner views */
[hidden] { display: none !important; }                  /* (the site's .btn and others would show them anyway) */
.lock { display: grid; place-items: center; min-height: calc(100vh - 56px); min-height: calc(100svh - 56px); padding: var(--gutter); text-align: center; }
.lock form { display: grid; justify-items: center; gap: 18px; }
.lock .eye { width: 54px; height: 54px; }
.lock .label { margin: 0; font: 400 11.5px/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.lock .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.lock input { width: min(260px, 70vw); padding: 13px 20px; border: 0; border-radius: 999px; background: rgb(255 255 255 / .45); box-shadow: inset 0 0 0 1px var(--rule); font: 400 13px/1 var(--mono); color: var(--ink); }
.lock input:focus { outline: none; box-shadow: inset 0 0 0 1px var(--ink); }
.lock .msg { min-height: 1.4em; margin: 0; font: 400 11px/1.4 var(--mono); letter-spacing: .03em; color: var(--ink-2); }
button.btn { border: 0; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.btn.ghost:hover { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px currentColor; }

/* The piece beside its text, like an auction lot. The artwork has a fixed slot (sized by the script for the largest,
   square piece), so the text never moves; the piece keeps a 28px margin inside its frame, so the slot bleeds out by 28px.
   The text runs on into notes about the collection, so on wide screens the piece stays in view (sticky) while they scroll. */
.vigil-view { padding-top: clamp(24px, 4vw, 56px); overflow-x: clip; }
.vigil { display: grid; grid-template-columns: auto minmax(0, 34rem); justify-content: center; gap: clamp(28px, 5vw, 80px); align-items: start; }
.vigil .piece { position: sticky; top: 72px; width: min(80svh, 1100px); height: min(80svh, 1100px); margin: -28px; }
.vigil .piece iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: transparent; }
.piece-bar { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0 0; }
@media (max-width: 900px) {
  .vigil { grid-template-columns: minmax(0, 1fr); }
  .vigil-text { display: contents; }                   /* stacked: the intro, then the piece, then the notes */
  .vigil-intro { order: -1; }
  .vigil-notes { order: 1; min-width: 0; }
  .vigil .piece { position: relative; top: auto; justify-self: center; width: calc(100% + 56px); height: min(76svh, 900px); }
}
/* full screen: the real thing where the browser allows it, otherwise (iPhone) a fixed overlay */
.vigil .piece:fullscreen, .vigil .piece.full { position: fixed; inset: 0 !important; z-index: 50; width: auto !important; height: auto !important; margin: 0; justify-self: stretch; align-self: stretch; background: #0b0b0d; }   /* stretch: centring would shrink a fixed box to nothing */
.vigil .piece:fullscreen iframe, .vigil .piece.full iframe { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
html:has(.piece.full) { overflow: hidden; }
.piece .close { display: none; position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; z-index: 2; width: 40px; height: 40px; padding: 0; border: 1px solid rgb(236 230 221 / .25); border-radius: 50%; background: rgb(11 11 13 / .55); color: #ece6dd; font: 400 20px/1 var(--mono); cursor: pointer; }
.piece:fullscreen .close, .piece.full .close { display: grid; place-items: center; }
/* a family as a row: the open piece in the middle, its siblings on either side as they hang, faded, all drawn live by one
   piece (the strip, .fam) across the row's span, its ends fading out. Over it, the row: a sideways scroller (trackpad, touch,
   or dragged with the mouse) of empty panels that snaps to a piece and tells the strip where they are. Alone, the strip
   shows one piece, and takes clicks itself (a click drops a stone, as on a lone piece). */
.vigil .piece iframe.fam { inset: auto; pointer-events: none; }
.vigil .piece iframe.fam:not(.inrow) { pointer-events: auto; }
.piece .fam.inrow { -webkit-mask: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); mask: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); }
.piece .row { position: absolute; z-index: 1; top: 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none;
  cursor: grab; user-select: none; -webkit-user-select: none; outline-offset: -2px; }
.piece .row::-webkit-scrollbar { display: none; }
.piece .row.dragging { scroll-snap-type: none; cursor: grabbing; }
.piece .row .track { position: relative; height: 100%; }
.piece .row .panel { position: absolute; scroll-snap-align: start; }
/* two small arrows under the piece in the middle: the piece before it and the piece after */
.piece .steps { position: absolute; z-index: 2; display: flex; justify-content: space-between; pointer-events: none; }
.piece .steps button { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink-2); cursor: pointer; pointer-events: auto; }
.piece .steps button:hover { color: var(--ink); }
.piece .steps button[aria-disabled="true"] { opacity: .35; color: var(--ink-2); cursor: default; }
.piece .steps svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 900px) { .vigil .piece:has(> .steps:not([hidden])) { margin-bottom: 8px; } }   /* stacked: room for them above the notes */
/* stacked, after a button in the notes has brought the piece into view: a pill at the foot of the screen that leads back */
.back { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 20; gap: 9px; white-space: nowrap;
  box-shadow: 0 6px 18px rgb(42 36 33 / .22); opacity: 0; visibility: hidden; transform: translate(-50%, 10px); transition: opacity .2s, transform .2s, visibility 0s .2s; }
.back.in { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition: opacity .2s, transform .2s; }
.back svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
@media (min-width: 901px) { .back { display: none; } }
@media (prefers-reduced-motion: reduce) { .back, .back.in { transition: none; } }
</style>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const P = JSON.parse($('#payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = $('.lock .msg'), input = $('.lock input');
  if (!window.crypto || !crypto.subtle) { msg.textContent = 'this page needs a secure (https) connection'; return; }

  // the password stretches into an AES key (PBKDF2, many rounds, so guessing is slow); a wrong password fails the GCM check
  const decrypt = async pw => {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, key, b64(P.data))));
  };
  const open = async (pw, quiet) => {
    if (!pw) return;
    msg.textContent = 'opening…';
    try {
      const data = await decrypt(pw);
      try { sessionStorage.setItem('vigil-key', pw); } catch { }   // this tab only: a reload doesn't ask again
      show(data);
    } catch {
      try { sessionStorage.removeItem('vigil-key'); } catch { }
      msg.textContent = quiet ? '' : 'that isn’t it'; input.select();
    }
  };
  $('.lock form').addEventListener('submit', e => { e.preventDefault(); open(input.value); });
  // A shared link may carry the password after # (#k=…): browsers never send that part to the server. It is taken out of
  // the address bar as soon as it is read.
  const m = location.hash.match(/^#k=(.+)$/);
  let kept = null; try { kept = sessionStorage.getItem('vigil-key'); } catch { }
  if (m) { history.replaceState(null, '', location.pathname); open(decodeURIComponent(m[1])); }
  else if (kept) open(kept, true);
  else input.focus();

  function show(data) {
    $('#app').innerHTML = data.html;
    document.title = 'vigil — 0010';
    const piece = $('.vigil .piece'), text = $('.vigil-text'), PAD = 28, stacked = matchMedia('(max-width: 900px)');
    let shape = null, waiting = [];
    // What the frame shows: its seed and traits (as the piece reports them), a pinned hour (null: the viewer's clock), and the
    // place in the notes' example family, if any ({ id, n, i, shift, keep }, shift moving the messenger's clock). pick: the trait
    // whose button the viewer clicked last ('Trait:Value'), until another piece takes over; beforeFam: the seed shown before
    // a family opened; msg: whether a family shows its messenger (the switch in the notes).
    const st = { seed: null, traits: null, hour: null, fam: null, timing: null, booting: true, pick: null, beforeFam: null, msg: true };
    let searchId = 0;
    // A family is drawn by a live piece of its own, the strip (see below): every piece of it side by side in one canvas, under
    // the row, which only scrolls. row: on (the whole family; off, one piece), its panels (empty boxes for the row to snap to),
    // its geometry, whether it is moving; thumbs: stills of a new family's pieces ({ url, light }).
    const row = { on: false, fam: null, panels: [], thumbs: [], shape: null, aw: 0, step: 0, xc: 0, top: 0, ah: 0, moving: false, drag: null, dragged: false, single: null, endT: 0, aim: null };
    let sf = null, sfNext = null;                      // the strip on screen, and one opening to take its place
    const frame = document.createElement('iframe');
    frame.title = 'vigil, a live generative piece';
    piece.append(frame);
    const withParams = q => data.piece.replace('<head>', `<head><script>window.__vigilParams = "${q}";<\/script>`);
    const boot = q => {                                // the lone piece (a family's strip stays on screen until it is ready)

    const ready = () => st.booting ? new Promise(r => waiting.push(r)) : Promise.resolve();

    const lab = () => { if (st.booting) return null; try { return frame.contentWindow.__lab || null; } catch { return null; } };   // (not the page being replaced)
    const stripLab = () => { try { return sf && sf.contentWindow.__lab || null; } catch { return null; } };
    const reopen = () => {
      const q = new URLSearchParams({ embed: 1 });

    };
    const openSeed = seed => {
      if (seed === st.seed && !st.fam) return;
      st.seed = seed;
      if (!st.fam && lab()) lab().load(seed); else { if (st.fam) { st.fam = null; hideRow(); } reopen(); }   // (out of a family: see leaveFamily)
    };
    const setHour = h => {
      st.hour = h;

    };

    // ---- traits: each button is one trait value ('Folds:Rings'); lines and bokashi combine with the others of their trait
    const spec = key => { const i = key.indexOf(':'); return { k: key.slice(0, i), v: key.slice(i + 1) }; };
    const keyOf = el => `${el.dataset.trait}:${el.dataset.value}`;
    const has = (t, key) => { const { k, v } = spec(key); return String((t || {})[k] ?? '').split(/ \+ | · /).includes(v); };
    // A random seed that has the trait: random codes through the piece's traitsOf, about 0.15 ms each (so some 140 tries,
    // 20 ms, for the rarest trait), 8 ms at a time so the piece keeps drawing.
    const ABC = 'abcdefghjkmnpqrstuvwxyz23456789';
    const randomCode = () => Array.from(crypto.getRandomValues(new Uint32Array(10)), v => ABC[v % 31]).join('');
    const find = async (L, key, id) => {
      for (const t0 = performance.now(); performance.now() - t0 < 4000; await new Promise(r => setTimeout(r))) {

    const seen = new Set();                            // (the buttons whose example has been shown)

    };

    // ---- families: an example family's thumbnail, or "new family", opens the family as a row around one of its pieces;
    // a trait's button leaves the family

    const shiftTo = p => {                             // the clock shift that puts it p seconds into its round now

      st.fam = { id, n, i, shift: null, keep: null, made }; st.seed = seedOf(id, i);

    const liveFrames = () => sf ? [sf] : [];
    const tell = f => {                                // (directly where it can, so it holds from the strip's next frame)

    const switchMessenger = () => {

    };

    };
    const clearThumbs = () => { for (const t of row.thumbs) if (t) URL.revokeObjectURL(t.url); row.thumbs = []; };
    const focus = i => {                               // another piece in the middle: only the strip is told

    };

      row.step = 0;                                    // (scrolling means nothing until it is laid out again: emptied, it snaps back to the start)
    };
    const buildRow = () => {
      const n = st.fam.n;

    };

    // the strip across the row's span, and in a row each panel there, one step apart
    const layFamily = (SW, SH, w, h, left, top, H) => {

    strip.addEventListener('scroll', () => {

    strip.addEventListener('click', e => {

    const markSteps = () => {

      const b = e.target.closest('[data-step]');

    });

    let developing = false;
    const develop = async () => {
      if (developing) return;

          const H = shape || 1, w = Math.round(Math.min(170, 200 / H) * Math.min(devicePixelRatio || 1, 2));
          let url = null; try { url = URL.createObjectURL(await L.strip.still(k, w)); } catch { }
          if (!st.fam || st.fam.id !== fam || String(st.hour) !== light || stripLab() !== L || k >= st.fam.n) { if (url) URL.revokeObjectURL(url); continue; }
          if (row.thumbs[k]) URL.revokeObjectURL(row.thumbs[k].url);
          row.thumbs[k] = { url, light }; preview();
          await new Promise(r => setTimeout(r, 30));
        }
      } finally { developing = false; }
    };

    // a new family on display, under its button: its pieces as thumbnails (the row's stills; clicked, like an example's),
    // under a line in the examples' manner, e.g. "five pieces · rings, turning at the fifth · 9:16"
    const NUM = 'two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty'.split(' ');
    const preview = () => {
      const box = text.querySelector('.famview'); if (!box) return;
      const F = box.querySelector('.family');
      box.hidden = !(st.fam && st.fam.made);
      if (box.hidden) { if (F.firstChild) { F.replaceChildren(); F.dataset.family = ''; } return; }   // (its stills are let go)
      const n = st.fam.n, H = row.shape || shape || 1;
      if (F.dataset.family !== st.fam.id) { F.replaceChildren(); F.dataset.family = st.fam.id; }
      F.dataset.fn = n; F.style.setProperty('--n', n); F.style.setProperty('--w', `${Math.min(170, Math.round(200 / H))}px`);
      while (F.children.length > n) F.lastChild.remove();
      while (F.children.length < n) {
        const i = F.children.length, b = document.createElement('button');
        b.type = 'button'; b.className = 'sib'; b.dataset.fi = i; b.dataset.seed = seedOf(st.fam.id, i); b.setAttribute('aria-label', `piece ${i + 1} of the new family`);
        const ph = document.createElement('span'), pn = document.createElement('span'), num = document.createElement('span');
        ph.className = 'ph'; pn.className = 'pn'; num.textContent = i + 1; pn.append(num); b.append(ph, pn); F.append(b);
      }
      [...F.children].forEach((b, i) => {
        const url = row.thumbs[i] && row.thumbs[i].url, pic = b.firstChild;
        if (url && pic.src !== url) { const img = new Image(); img.alt = ''; img.src = url; pic.replaceWith(img); }
        else if (!url) pic.style.aspectRatio = `1 / ${H}`;
      });
      const t = st.traits, own = t && st.reported && (st.reported === st.fam.id || st.reported.startsWith(`${st.fam.id}-`));
      if (own) {                                       // (the traits of one of its pieces: they share their kind of bands and format)
        const turns = t.Folds === 'Rings' && n >= 5 ? `, turning at the ${['fifth', 'fifth and tenth', 'fifth, tenth and fifteenth'][Math.min(2, Math.floor(n / 5) - 1)]}` : '';
        box.querySelector('.glabel').textContent = `${NUM[n - 2]} pieces · ${String(t.Folds).toLowerCase()}${turns} · ${t.Format}`;
      }
    };

    // the notes mark in red whatever the piece on screen has, outline the button clicked last, and list all the piece's traits
    const mark = () => {
      preview();
      const t = st.traits || {};
      for (const el of text.querySelectorAll('[data-trait]')) {
        const on = has(t, keyOf(el));
        el.classList.toggle('on', on); el.classList.toggle('pick', on && st.pick === keyOf(el));
        el.setAttribute('aria-pressed', on);
      }
      for (const el of text.querySelectorAll('[data-hour]')) {
        const on = el.dataset.hour === 'now' ? st.hour === null : +el.dataset.hour === st.hour;
        el.classList.toggle('on', on); el.classList.toggle('pick', on && el.dataset.hour !== 'now'); el.setAttribute('aria-pressed', on);
      }
      for (const el of text.querySelectorAll('[data-fi]')) {
        const on = !!st.fam && el.closest('[data-family]').dataset.family === st.fam.id && +el.dataset.fi === st.fam.i;
        el.classList.toggle('on', on); el.classList.toggle('pick', on); el.setAttribute('aria-pressed', on);
      }
      const n = st.fam ? st.fam.n : famSize, made = text.querySelector('[data-vigil="family"]');
      if (made) {
        made.classList.toggle('pick', !!st.fam && !!st.fam.made); made.setAttribute('aria-pressed', !!st.fam && !!st.fam.made);
        text.querySelector('.count output').textContent = `${n} pieces`;
        text.querySelector('[data-vigil="fewer"]').disabled = n <= 2; text.querySelector('[data-vigil="more"]').disabled = n >= 20;
      }
      const rb = $('[data-vigil="row"]');
      if (rb) { rb.hidden = !st.fam; rb.textContent = row.on ? 'one piece' : 'whole family'; }
      const mb = text.querySelector('[data-vigil="messenger"]'), mOn = !!st.fam && st.msg;   // (on only while a family shows it)
      if (mb) { mb.setAttribute('aria-checked', mOn); mb.querySelector('.n').textContent = mOn ? 'on' : 'off'; }
      markSteps();
      $('[data-v="seed"]').textContent = st.seed || '';
      $('[data-v="traits"]').replaceChildren(...Object.entries(t).flatMap(([k, v]) => {
        const dt = document.createElement('dt'), dd = document.createElement('dd');
        dt.textContent = k.toLowerCase(); dd.textContent = v; return [dt, dd];
      }));
    };
    const fit = () => {
      let SW, SH;                                      // the slot, the piece's margin included
      const box = piece.parentElement.clientWidth;
      if (stacked.matches) {                           // stacked under the text: the slot follows the piece
        SW = box + 2 * PAD; SH = Math.min(innerHeight * 0.76, 900);
        if (shape) SH = Math.min(SH, (SW - 2 * PAD) * shape + 2 * PAD);
        piece.style.top = '';
      } else {                                         // beside the text: one fixed slot for every shape
        SH = Math.min(innerHeight * 0.8, 1100); SW = Math.min(SH, box * 0.62 + 2 * PAD);
        const bar = $('.bar').offsetHeight;            // kept centred in the space under the site's bar while the notes scroll
        piece.style.top = `${Math.floor(Math.max(bar + 12, (innerHeight + bar - SH) / 2))}px`;
      }
      piece.style.width = `${Math.floor(SW)}px`; piece.style.height = `${Math.floor(SH)}px`;
      if (isFull()) { SW = piece.clientWidth; SH = piece.clientHeight; }   // (full screen: the screen is the slot)
      const H = shape || (row.on && row.shape);       // (a family's pieces share their shape, so a row keeps its own meanwhile)
      if (!H) return;
      const aw = Math.min(SW - 2 * PAD, (SH - 2 * PAD) / H), ah = aw * H;   // the artwork, contained in the slot
      const w = Math.floor(aw + 2 * PAD), h = Math.floor(ah + 2 * PAD), top = Math.floor((SH - h) / 2);
      let left = Math.floor((SW - w) / 2);
      // beside the text, a row moves the piece left (by up to the column gap) so that the siblings on either side show about
      // as much of themselves, the one on the right stopping well short of the text
      if (row.on && !stacked.matches) {
        const S = rowSpan();
        if (S.gap) left -= Math.round(Math.min(S.gap, Math.max(0, ((left + PAD - S.X0) - (S.X1 - left - w + PAD)) / 2)));
      }
      Object.assign(frame.style, { width: `${w}px`, height: `${h}px`, left: `${left}px`, top: `${top}px` });
      if (shape && !st.fam) {
        frame.style.visibility = 'visible';
        // (a frame resized while hidden gets no resize event, and would keep the artwork where its last size put it)
        if (frame.dataset.size !== `${w}x${h}`) { frame.dataset.size = `${w}x${h}`; frame.contentWindow.postMessage('vigil:layout', '*'); }
      }
      if (st.fam && sf) layFamily(Math.floor(SW), Math.floor(SH), w, h, left, top, H);
    };
    new ResizeObserver(fit).observe(piece.parentElement);   // fire only when the layout changes size
    addEventListener('resize', fit);
    // The pieces report their seed, shape (height / width) and traits: the lone piece once it opens; a family's strip once it
    // opens, and again for each piece that comes to the middle (with the messenger's timetable).
    const reported = d => {
      shape = d.H; st.booting = false;
      if (st.fam) row.shape = d.H;
      fit(); mark();
      showing()?.pause?.(!pieceSeen);
      waiting.splice(0).forEach(r => r());
    };
    addEventListener('message', e => {
      const d = e.data && e.data.vigil; if (!d) return;
      if (sfNext && e.source === sfNext.contentWindow) takeStrip();   // (a new family's strip, ready to show)
      else if (!sf || e.source !== sf.contentWindow) {
        if (e.source !== frame.contentWindow || st.fam) return;       // (the lone piece, unless a family has opened since)
        st.seed = d.seed; st.traits = d.traits; st.reported = d.seed;
        reported(d);
        if (sf || sfNext) (async () => {               // a family left: it stays on screen (over the lone piece) until that has drawn
          for (let k = 0; k < 60 && !lab()?.fps; k++) await new Promise(r => requestAnimationFrame(r));
          if (!st.fam) dropStrip();
        })();
        return;
      }
      if (!st.fam) return;
      if (d.fi !== st.fam.i) { stripLab()?.strip.focus(st.fam.i); return; }   // (another piece came to the middle meanwhile)
      st.seed = d.seed; st.traits = d.traits; st.reported = d.seed;
      if (sf.hour !== st.hour) { sf.hour = st.hour; stripLab()?.setHour(st.hour); }   // (the light changed while it opened)
      if (d.msg) {                                     // the messenger's timetable
        st.timing = d.msg;
        if (st.fam.shift === null && st.msg) setClock(); else tell(sf);   // (a switch made while it opened)
      }
      reported(d); develop();
    });
    fit();
    // Stacked, a button in the notes brings the piece into view, far above it. A pill at the foot of the screen then leads
    // back to the button, until the button is in view again however the reader gets there (an IntersectionObserver tells,
    // so nothing runs meanwhile).
    const back = document.createElement('button');
    back.type = 'button'; back.className = 'btn back';
    back.innerHTML = '<svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M5 1v10M1 7l4 4 4-4"/></svg><span></span>';
    document.body.append(back);
    let backTo = null;
    const backOff = () => { back.classList.remove('in'); if (backTo) { backTo.seen.disconnect(); backTo = null; } };
    const leaveMark = (el, y) => {                     // y: where the button was on screen when it was clicked
      backOff();
      const sec = el.closest('section') || text, h = sec.querySelector('h3');
      back.lastChild.textContent = `back to ${h ? h.textContent.toLowerCase() : 'the notes'}`;
      let gone = false;
      const seen = new IntersectionObserver(([e]) => {
        if (e.intersectionRatio < 0.5) { gone = true; back.classList.add('in'); }
        else if (gone) backOff();
      }, { threshold: 0.5 });
      backTo = { el, sec, y, seen };
      seen.observe(el);
    };
    back.addEventListener('click', () => {
      if (!backTo) return;
      const { el, sec, y } = backTo, there = el.isConnected;   // (a new family's thumbnails may be gone by now: its section, then)
      backOff();
      const to = there ? el : sec, at = there ? y : $('.bar').offsetHeight + 16;
      scrollTo({ top: scrollY + to.getBoundingClientRect().top - at, behavior: smooth() });
      if (there) el.focus({ preventScroll: true });
    });
    text.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const y = b.getBoundingClientRect().top;         // (before the click changes anything above it)
      if (b.dataset.fi !== undefined) openSibling(b);
      else if (b.dataset.trait) choose(b);
      else if (b.dataset.hour) { const h = b.dataset.hour === 'now' ? null : +b.dataset.hour; if (h !== null || st.hour !== null) setHour(h === st.hour ? null : h); }
      else if (b.dataset.vigil === 'messenger') switchMessenger();
      else if (b.dataset.vigil === 'family') openFamily(randomCode(), famSize, 0, true);
      else if (b.dataset.vigil === 'fewer' || b.dataset.vigil === 'more') { resize(b.dataset.vigil === 'more' ? 1 : -1); return; }   // (the piece stays where it is)
      else if (b.dataset.vigil === 'row') { if (row.on) showOne(st.fam.i); else showRow(); return; }
      else return;
      // stacked, the piece sits above the notes: bring it into view to show what the button changed, and leave the way back.
      // Its top goes where a piece of the full height would sit centred, whatever its format (a new piece reports that only
      // once it has opened); by the window's own smooth scroll, since Chrome drops a smooth scrollIntoView once the row moves.
      if (stacked.matches) {
        const r = piece.getBoundingClientRect(), slot = Math.min(innerHeight * 0.76, 900);
        scrollTo({ top: scrollY + r.top - Math.max($('.bar').offsetHeight, (innerHeight - slot) / 2), behavior: smooth() });
        leaveMark(b, y);
      }
    });
    $('[data-vigil="new"]').addEventListener('click', () => {
      const wasFam = !!st.fam;
      st.fam = null; st.pick = null; say(text, ''); mark();
      if (wasFam || !lab()) { st.seed = null; hideRow(); boot('embed=1'); }   // (out of a family the lone piece reopens; the family stays until it is ready)
      else frame.contentWindow.postMessage('vigil:new', '*');
    });
    // full screen shows one piece (a row stays on the page); the layout follows it in and out (a lone piece fills its frame
    // there by itself, a family's strip is told where its piece goes)
    const overlay = on => { piece.classList.toggle('full', on); fit(); };
    $('[data-vigil="full"]').addEventListener('click', () => {
      if (row.on) { hideRow(); mark(); }
      if (piece.requestFullscreen) piece.requestFullscreen().catch(() => overlay(true));
      else overlay(true);
    });
    document.addEventListener('fullscreenchange', fit);
    $('.piece .close').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); overlay(false); });
    addEventListener('keydown', e => { if (e.key === 'Escape' && piece.classList.contains('full')) overlay(false); });
  }
})();
</script>
</body>
</html>
