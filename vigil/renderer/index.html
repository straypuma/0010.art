  say(`${what}: waiting for transaction ${hash}.`);
  for (;;) {
    const r = await P.request({ method: 'eth_getTransactionReceipt', params: [hash] });
    if (r) { if (r.status !== '0x1') throw new Error(`${what} failed (transaction ${hash}).`); return r; }
    await sleep(4000);
  }
}
const seen = new Set();
function offer(info, provider) {
  if (seen.has(info.uuid)) return; seen.add(info.uuid);
  const b = document.createElement('button'); b.textContent = `connect ${info.name}`; b.onclick = () => connect(provider).catch(e => say(e.message || String(e), true));
  $('wallets').append(b);
}
addEventListener('eip6963:announceProvider', e => offer(e.detail.info, e.detail.provider));
dispatchEvent(new Event('eip6963:requestProvider'));
setTimeout(() => { if (!seen.size && window.ethereum) offer({ uuid: 'injected', name: 'wallet' }, window.ethereum); else if (!seen.size) say('No wallet found in this browser.', true); }, 600);

async function connect(provider) {
  P = provider;
  [account] = await P.request({ method: 'eth_requestAccounts' });
  if (Number(await P.request({ method: 'eth_chainId' })) !== D.chainId) {
    await P.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + D.chainId.toString(16) }] });
    if (Number(await P.request({ method: 'eth_chainId' })) !== D.chainId) throw new Error(`Switch the wallet to ${D.chainName}.`);
  }
  $('wallets').hidden = true;
  await refresh();
}

// ---- the artwork, read from the Vigil contract and run here to work out traits, as each token runs it. A single
// piece's traits come from one hidden copy of the piece (its traitsOf); a family's piece is opened with the token's own
// settings (seed, family, place, size) in a copy of its own, since a piece takes its family from its page's settings.
let pieceHtml = null, lone = null;
async function opened(q) {
  if (!pieceHtml) {
    say('Reading the artwork from the contract.');
    const h = await call(D.vigil, D.sel.vigil['script()']), gz = bytesOf(h.slice(128, 128 + rd(h, 32) * 2));
    pieceHtml = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  const f = document.createElement('iframe'); f.hidden = true;   // (rec=1: the piece keeps still and draws nothing by itself)
  f.srcdoc = pieceHtml.replace('<head>', `<head><script>window.__vigilParams=${JSON.stringify('rec=1&' + q)}<\/script>`);
  document.body.append(f);
  for (let i = 0; i < 200 && !(f.contentWindow && f.contentWindow.__lab && f.contentWindow.__lab.scene); i++) await sleep(50);
  if (!(f.contentWindow.__lab && f.contentWindow.__lab.scene)) { f.remove(); throw new Error('The artwork did not start in this browser.'); }
  return f;
}
const plain = tr => { const t = {}; for (const k in tr) if (k !== 'Family') t[k] = String(tr[k]); return t; };
async function traitsOfSeed(c) { lone = lone || await opened('seed=aaaaaaaaaa'); return plain(lone.contentWindow.__lab.traitsOf(c)); }
async function traitsOfPiece(p) {
  if (p.n < 2) return traitsOfSeed(p.code);
  const f = await opened(`seed=${p.code}&family=${p.first}&fi=${p.i}&fn=${p.n}`);
  try { return plain(f.contentWindow.__lab.scene.traits); } finally { f.remove(); }
}

// ---- what the chain holds
const S = {};
const each = async (list, f) => { const out = []; for (let i = 0; i < list.length; i += 20) out.push(...await Promise.all(list.slice(i, i + 20).map(f))); return out; };   // 20 reads at a time
const SEED = /^[0-9a-z]{10}$/, code = w => new TextDecoder().decode(bytesOf(w.slice(0, 20)));
async function refresh() {
  say('Reading the contracts.');
  S.owner = '0x' + (await call(D.vigil, D.sel.vigil['owner()'])).slice(24);
  S.current = '0x' + (await call(D.vigil, D.sel.vigil['renderer()'])).slice(24);
  S.supply = rd(await call(D.vigil, D.sel.vigil['totalSupply()']), 0);
  S.isOwner = same(S.owner, account);
  S.connected = !same(S.current, D.first);
  S.r2 = S.connected ? S.current : localStorage.getItem(KEY);
  if (S.r2 && !S.connected) {   // remembered from an earlier visit: it must be a renderer of this Vigil contract
    try { if (!same('0x' + (await call(S.r2, D.sel.r['vigil()'])).slice(24), D.vigil)) S.r2 = null; } catch { S.r2 = null; }
  }
  S.pieces = await each(Array.from({ length: S.supply }, (_, k) => k + 1), async id => {
    const r = await call(D.vigil, D.sel.vigil['piece(uint256)'] + word(id));
    const c = code(r.slice(0, 64)), first = code(r.slice(256, 320));
    return { id, code: SEED.test(c) && SEED.test(first) ? c : null, first, i: rd(r, 64), n: rd(r, 96) };
  });
  if (S.r2) {
    const h = await call(S.r2, D.sel.r['traitSchema()']);
    S.names = decArr(h, rd(h, 0), decStr); S.values = decArr(h, rd(h, 32), (h, at) => decArr(h, at, decStr));
    S.images = decStr(await call(S.r2, D.sel.r['imageBase()']), 32);
    await each(S.pieces, async p => { p.packed = BigInt('0x' + await call(S.r2, D.sel.r['traitsOf(uint256)'] + word(p.id))); });
  } else { S.names = []; S.values = []; S.images = D.imageBase; }
  render(); say('');
}
const KEY = `vigil-renderer2:${D.chainId}:${D.vigil.toLowerCase()}`;
const drawn = () => S.pieces.filter(p => p.code), bare = () => drawn().filter(p => p.packed === 0n || p.packed === undefined);

function step(id, done, state, can) {
  const li = $(id); li.classList.toggle('done', done); li.querySelector('.state').textContent = state;
  const b = li.querySelector('button'); b.disabled = !can || busy; b.hidden = done && id !== 's-traits' && id !== 's-stills';
}
let busy = false, stills = null;
function render() {
  $('steps').hidden = false;
  $('who').textContent = S.isOwner ? `Connected as the owner, ${short(account)}.` : `Connected as ${short(account)}. The contract's owner is ${short(S.owner)}; only that wallet can use this page.`;
  const o = S.isOwner, wait = S.pieces.length - drawn().length, todo = bare().length;
  step('s-deploy', !!S.r2, S.r2 ? `At ${S.r2}. Stills are read from ${S.images || 'no address'}.` : `A new contract. Stills will be read from ${D.imageBase}.`, o && !S.r2);
  step('s-schema', S.names.length > 0, S.names.length ? `${S.names.length} traits, ${S.values.reduce((a, v) => a + v.length, 0)} values.` : 'The names of the traits and the values each can take.', o && !!S.r2 && !S.names.length);
  step('s-traits', S.names.length > 0 && !todo, `${S.supply} minted. ${!S.r2 || !S.names.length ? '' : todo ? `${todo} without traits.` : 'All have their traits.'}${wait ? ` ${wait} without a seed yet.` : ''}`, o && S.names.length > 0 && todo > 0);
  step('s-connect', S.connected, S.connected ? `Marketplaces read ${short(S.current)}.` : `Marketplaces still read the first renderer, ${short(D.first)}.`, o && !!S.r2 && !S.connected);
  step('s-stills', false, stills === null ? '' : stills.length ? `No still yet for ${stills.length} of ${drawn().length}: ${stills.slice(0, 12).map(p => '#' + p.id).join(', ')}${stills.length > 12 ? ' …' : ''}` : `All ${drawn().length} stills are there.`, !!S.images);
}
async function act(f) {
  if (busy) return; busy = true; render();
  try { await f(); busy = false; await refresh(); } catch (e) { busy = false; render(); say(e && e.code === 4001 ? 'Declined in the wallet.' : (e && e.message) || String(e), true); }
}

// ---- the steps
$('s-deploy').querySelector('button').onclick = () => act(async () => {
  const r = await send({ data: '0x' + D.code + encArgs([{ s: addrWord(D.vigil) }, { d: encStr(D.imageBase) }]) }, 'Deploying the second renderer');
  if (!r.contractAddress) throw new Error('The deploy gave no address.');
  localStorage.setItem(KEY, r.contractAddress);
});

// The list: every value seen over 20,000 fixed seeds ("census-0" …) and the minted pieces, in order of first appearance.
// A value that turns up later is added after the others (the contract only ever adds values at the end).
$('s-schema').querySelector('button').onclick = () => act(async () => {
  const names = [], values = [];
  const take = tr => { for (const k in tr) { let i = names.indexOf(k); if (i < 0) { i = names.push(k) - 1; values.push([]); } if (!values[i].includes(tr[k])) values[i].push(tr[k]); } };
  for (let k = 0; k < 20000; k++) { take(await traitsOfSeed('census-' + k)); if (k % 500 === 499) { say(`Working out the trait list: ${k + 1} of 20,000 seeds.`); await sleep(0); } }
  for (const p of drawn()) take(await traitsOfPiece(p));
  if (names.length > 32 || values.some(v => v.length > 255)) throw new Error('The trait list does not fit the contract (32 traits, 255 values each).');
  await send({ to: S.r2, data: '0x' + D.sel.r['addTraits(string[],string[][])'] + encArgs([{ d: encStrs(names) }, { d: encStrss(values) }]) }, `Writing ${names.length} traits`);
});

$('s-traits').querySelector('button').onclick = () => act(async () => {
  const list = bare().slice(0, 150), rows = [], more = S.names.map(() => []);
  for (const p of list) {
    if (rows.length % 10 === 0) say(`Working out traits: ${rows.length} of ${list.length} pieces.`);
    const tr = await traitsOfPiece(p), row = [];
    for (const k in tr) {
      const i = S.names.indexOf(k); if (i < 0) throw new Error(`The contract's list has no trait "${k}".`);
      if (!S.values[i].includes(tr[k]) && !more[i].includes(tr[k])) more[i].push(tr[k]);
      row.push([i, tr[k]]);
    }
    rows.push(row);
  }
  for (let i = 0; i < more.length; i++) if (more[i].length) {
    await send({ to: S.r2, data: '0x' + D.sel.r['addTraitValues(uint256,string[])'] + encArgs([{ s: word(i) }, { d: encStrs(more[i]) }]) }, `Adding ${more[i].length} new value${more[i].length > 1 ? 's' : ''} to ${S.names[i]}`);
    S.values[i].push(...more[i]);
  }
  const packed = rows.map(row => row.reduce((a, [i, v]) => a | (BigInt(S.values[i].indexOf(v) + 1) << BigInt(8 * i)), 0n));
  await send({ to: S.r2, data: '0x' + D.sel.r['setTraits(uint256[],uint256[])'] + encArgs([{ d: encUints(list.map(p => p.id)) }, { d: encUints(packed) }]) }, `Writing the traits of ${list.length} piece${list.length > 1 ? 's' : ''}`);
});

$('s-connect').querySelector('button').onclick = () => act(async () => {
  if (bare().length && !confirm(`${bare().length} pieces have no traits yet. Connect anyway?`)) return;
  await send({ to: D.vigil, data: '0x' + D.sel.vigil['setRenderer(address)'] + addrWord(S.r2) }, 'Connecting the second renderer');
});

$('s-stills').querySelector('button').onclick = () => act(async () => {
  const missing = [];
  await Promise.all(drawn().map(p => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = () => { missing.push(p); res(); }; im.src = S.images + p.code + '.webp'; })));
  stills = missing.sort((a, b) => a.id - b.id);
});

$('where').textContent = `${D.chainName} · Vigil ${D.vigil}`;
</script>
</body>
</html>
